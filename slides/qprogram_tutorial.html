<p>Then use one: <code>if_(handle.state == 1)</code> and play a <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>π</mi></mrow><annotation encoding="application/x-tex">\pi</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">π</span></span></span></span> pulse. Passive reset costs <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>5</mn><msub><mi>T</mi><mn>1</mn></msub></mrow><annotation encoding="application/x-tex">5T_1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord">5</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">1</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span> = 90 us<br />
per shot against a 2 us measurement, so <strong>97% of your fridge time is waiting</strong>. The arm that did not<br />

<h1 id="one-program-many-machines">One Program, Many Machines</h1>
<h3 id="the-same-calibration-a-different-rack">The same calibration, a different rack</h3>
<footer>Programming a Superconducting Qubit · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-footer="Programming a Superconducting Qubit · QCE 2026" lang="en-US" data-marpit-pagination="39" style="--paginate:true;--footer:Programming a Superconducting Qubit · QCE 2026;" data-marpit-pagination-total="49" data-size="16:9">
<h2 id="part-5-why-the-flux-line-is-a-different-instrument">Part 5: why the flux line is a different instrument</h2>
<p>Rack B puts a 20-bit DC source on the flux line instead of an AWG output, and that is not a matter<br />
of taste. Flux noise is the main thing dephasing this qubit, and the qubit frequency tracks the bias<br />
directly, so the flux line is the one path where broadband noise turns straight into decoherence.</p>
<p><strong>The same filtering that keeps the line quiet is what keeps it slow.</strong> Millisecond time constants,<br />
Ethernet, no FPGA. That loop cannot be a sequencer loop, and it cannot be made into one.</p>
<p>Three questions have to be answered before the program reaches an instrument:</p>
<ol>
<li>Does the rack implement every operation, waveform, and sweep shape used?</li>
<li>Does the program stay inside its numeric limits?</li>
<li>Which loops run in the sequencer, and which on the host?</li>
</ol>
<p><code>qp.validate(program, caps)</code> answers all three from the AST and <strong>never raises</strong>. <code>execute</code> is the step that turns an error into an exception.</p>
<footer>Programming a Superconducting Qubit · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-footer="Programming a Superconducting Qubit · QCE 2026" lang="en-US" data-marpit-pagination="40" style="--paginate:true;--footer:Programming a Superconducting Qubit · QCE 2026;" data-marpit-pagination-total="49" data-size="16:9">
<h2 id="part-5-read-the-plan-then-let-optimize-fix-it">Part 5: read the plan, then let optimize fix it</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>body
└─ average 200:                        [host]    ~ forced-host  i reorderable-averaging
   └─ for bias in Linspace(...):       [host]
      ├─ set_offset q[0].flux bias     [host]
      ├─ play q[0].drive &quot;saturation&quot;  [rt|host]
      ├─ sync q[0].drive q[0].readout  [rt|host]
      └─ measure q[0].readout ...      [rt|host]
</code></pre>
<p>The <code>average</code> fell to <code>[host]</code> because it <em>encloses</em> a host-side sweep. A warning, not an error: it<br />
runs, and 20,200 round trips take twenty seconds instead of a fraction of one.</p>
<p>The validator names its own fix. <code>reorderable-averaging</code> points at <code>qp.optimize(program, caps)</code>,<br />
which rewrites <code>average { sweep { ... } }</code> into <code>sweep { setup; average { ... } }</code>. Now the host does<br />
101 DAC writes and the sequencer does the rest.</p>
<p>One habit blocks it: a bare <code>program.sync()</code> broadcasts across every bus, picks up the flux line,<br />
lands host-side, and the rewrite refuses to hoist across it. Name the two buses you mean.</p>
<footer>Programming a Superconducting Qubit · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-footer="Programming a Superconducting Qubit · QCE 2026" lang="en-US" data-marpit-pagination="41" style="--paginate:true;--footer:Programming a Superconducting Qubit · QCE 2026;" data-marpit-pagination-total="49" data-size="16:9">
<h2 id="part-5-rebind-and-waveform-libraries">Part 5: rebind and waveform libraries</h2>
<ul>
<li><code>program.rebind(naming=BusNaming(&quot;{kind}_{element}{index}&quot;))</code> renames every bus <strong>structurally</strong>, so the refs stay typed and the channel checks survive. A find-and-replace would give you strings that look right and carry no metadata.</li>
<li><code>rebind(elements={(&quot;q&quot;, 0): (&quot;q&quot;, 3)})</code> moves the experiment to another qubit. <code>rebind(schema=...)</code> moves it to another chip layout.</li>
<li><code>WaveformLibrary</code> resolves a string alias per bus in three tiers: exact <code>(element, idx, kind, name)</code>, then family <code>(element, kind, name)</code>, then global <code>(name,)</code>. Drive pulses are exact because two qubits never share a <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>π</mi></mrow><annotation encoding="application/x-tex">\pi</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">π</span></span></span></span> amplitude; weights are global.</li>
</ul>
<p>The library lives outside the <code>.qp</code> file, in its own <code>.wfl</code>. The program is the experiment and<br />
changes when you change the experiment; the library is the calibration and changes every morning.<br />
Merge them and neither diff means anything, because a recalibration and a redesign look identical.</p>
<blockquote>
<p><img class="emoji" draggable="false" alt="🧩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9e9.svg" data-marp-twemoji=""/> Write a predicate that enforces your own rule, then port the Part 3 program to a lab that names buses <code>drive_q0</code> style.</p>
</blockquote>
<footer>Programming a Superconducting Qubit · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-footer="Programming a Superconducting Qubit · QCE 2026" lang="en-US" data-marpit-pagination="42" style="--paginate:true;--footer:Programming a Superconducting Qubit · QCE 2026;" data-marpit-pagination-total="49" data-size="16:9">
<h2 id="part-5-the-rack-b-someone-already-published">Part 5: the rack B someone already published</h2>
<p><code>qprogram-qdac</code> and <code>qprogram-qblox</code> register <code>qdac-default-v1</code> and <code>qblox-default-v1</code>.<br />
<code>CompilerCapabilities.from_profile(name)</code> materializes either one. Neither package talks to an<br />
instrument.</p>
<p>A published profile lists what the box implements, not what the language knows. <code>qdac-default-v1</code><br />
<strong>refuses</strong> <code>op.set_offset</code>, because a QDAC channel is a slow-control write and not a sequencer<br />
opcode. So the flux line is spelled <code>program.qdac.set_offset</code> and the file grows <code>require qdac 0.1</code>.</p>
<p>Hand-built rack B filled both halves of every fast slot, so the mixed loop came back a <code>forced-host</code><br />
<strong>warning</strong>. The real profiles fill one half each, and the same loop is a <code>mixed-domain</code> <strong>error</strong>.</p>
<p>Which makes <code>qp.optimize</code> the step that turns an illegal program into a legal one, rather than a<br />
rewrite that only buys speed. Whether an optimization is optional turns out to be a property of the<br />
machine too.</p>
<footer>Programming a Superconducting Qubit · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-footer="Programming a Superconducting Qubit · QCE 2026" lang="en-US" data-marpit-pagination="43" style="--paginate:true;--footer:Programming a Superconducting Qubit · QCE 2026;" data-marpit-pagination-total="49" data-size="16:9">
<h2 id="one-program-two-domains">One program, two domains</h2>
<p><img src="img/plan.svg" alt="" style="height:430px;" /></p>
<p class="cap">The drive and readout lines sit on a fast sequencer, the flux line on a slow DAC. The bias loop lands host-side, the shot loop stays in hardware, and <code>optimize()</code> is what gets them into that order.</p>
<footer>Programming a Superconducting Qubit · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-footer="Programming a Superconducting Qubit · QCE 2026" data-class="divider" lang="en-US" class="divider" data-marpit-pagination="44" style="--paginate:true;--footer:Programming a Superconducting Qubit · QCE 2026;--class:divider;" data-marpit-pagination-total="49" data-size="16:9"><p class="kicker">Part 6 · notebooks/06_extending_and_shipping.ipynb</p>
<h1 id="extending-the-language-and-shipping-the-work">Extending the Language and Shipping the Work</h1>
<h3 id="your-own-waveform-your-own-vendor-and-the-bring-up-in-one-script">Your own waveform, your own vendor, and the bring-up in one script</h3>
<footer>Programming a Superconducting Qubit · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-footer="Programming a Superconducting Qubit · QCE 2026" lang="en-US" data-marpit-pagination="45" style="--paginate:true;--footer:Programming a Superconducting Qubit · QCE 2026;" data-marpit-pagination-total="49" data-size="16:9">
<h2 id="part-6-a-dsl-that-cannot-be-extended-gets-forked">Part 6: a DSL that cannot be extended gets forked</h2>
<p>And a forked DSL is not a portable format, it is three dialects sharing a file extension. So the<br />
extension points are what keep Part 5 true.</p>
<ul>
<li>A <strong>waveform</strong>: subclass <code>Waveform</code>, implement <code>envelope()</code> and <code>get_duration()</code>, decorate with <code>@qp.register_waveform</code>. Serialization is read off your constructor signature, so the constructor arguments have to <em>be</em> the state.</li>
<li>A <strong>sweep source</strong>: subclass <code>qp.SweepSource</code>, declare <code>KIND</code> and <code>TOKEN</code>, implement <code>length()</code> and <code>values()</code>. It <strong>may not wrap a callable</strong>: a callable cannot report its length before running, cannot honestly declare a kind, and cannot serialize. Three load-bearing properties, all gone.</li>
<li>A <strong>vendor namespace</strong>: one <code>Operation</code>, one <code>VendorNamespace</code> method, four registration calls. Then <code>program.fridge.set_attenuation(q[0].drive, 20.0)</code> works on any program.</li>
</ul>
<p>All three fit in a notebook cell. That is the test of an extension point: no fork, no patch to the<br />
core.</p>
<footer>Programming a Superconducting Qubit · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-footer="Programming a Superconducting Qubit · QCE 2026" lang="en-US" data-marpit-pagination="46" style="--paginate:true;--footer:Programming a Superconducting Qubit · QCE 2026;" data-marpit-pagination-total="49" data-size="16:9">
<h2 id="part-6-shipping-it">Part 6: shipping it</h2>
<p>The file grows <code>require fridge 0.1</code>, round-trips, and validates. A rack without the token reports<br />
<code>missing-capability</code> and names the path. A rack <strong>with</strong> the extension missing entirely finds it<br />
through a packaging entry point and imports it, so a six-month-old file loads without the reader<br />
knowing what the author had installed.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-diff"><span class="hljs-deletion">-  set_frequency q[0].readout 7200000000.0</span>
<span class="hljs-addition">+  set_frequency q[0].readout 7200400000.0</span>
<span class="hljs-deletion">-  average 200:</span>
<span class="hljs-addition">+  average 400:</span>
<span class="hljs-deletion">-    for amp in Linspace(start=0.0, stop=1.0, num=41):</span>
<span class="hljs-addition">+    for amp in Linspace(start=0.0, stop=0.8, num=41):</span>
</code></pre>
<p>Monday against Friday. The resonator moved 400 kHz, the shot count doubled, the amplitude range<br />
came down. You can reconstruct the week from a text diff, and none of it is in a plot.</p>
<p><code>python -m qprogram.lsp check run.qp</code> prints JSON diagnostics and exits non-zero, so it is a CI job.<br />
<code>explain</code> prints the plan tree. Neither needs an extra dependency.</p>
<blockquote>
<p><img class="emoji" draggable="false" alt="🧩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9e9.svg" data-marp-twemoji=""/> Add a vendor measurement field or a second vendor operation, then break a <code>.qp</code> file and fix it from the checker output.</p>
</blockquote>
<footer>Programming a Superconducting Qubit · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-footer="Programming a Superconducting Qubit · QCE 2026" lang="en-US" data-marpit-pagination="47" style="--paginate:true;--footer:Programming a Superconducting Qubit · QCE 2026;" data-marpit-pagination-total="49" data-size="16:9">
<h2 id="the-bring-up-end-to-end">The bring-up, end to end</h2>
<p><strong>resonator</strong> → <strong>qubit</strong> → <strong>π pulse</strong> → <strong>coherence</strong> → <strong>single shots</strong> → <strong>active reset</strong> → <strong>ported</strong> → <strong>shipped</strong></p>
<p>A dozen experiments, one set of primitives:</p>
<p><code>BusSchema</code> · <code>Waveform</code> · <code>Variable</code> · <code>SweepSource</code> · <code>Fragment</code> · <code>MeasurementField</code><br />
→ assembled into an <strong>AST</strong> → checked against <strong>capabilities</strong> → run by a swappable <strong>platform</strong>.</p>
<p>The capstone runs all seven steps in order, feeding each fit into the next, and writes a <code>.qp</code> per<br />
step plus one <code>.wfl</code>. Here that takes seconds. On hardware with passive reset it is about ten<br />
minutes, and the reason to automate it is not those ten minutes, it is the fifty qubits after this<br />
one.</p>
<blockquote>
<p>Two vendor packages, imported for what they declare rather than for what they drive. Nothing today talked to an instrument, and nothing today was written twice.</p>
</blockquote>
<footer>Programming a Superconducting Qubit · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-footer="Programming a Superconducting Qubit · QCE 2026" lang="en-US" data-marpit-pagination="48" style="--paginate:true;--footer:Programming a Superconducting Qubit · QCE 2026;" data-marpit-pagination-total="49" data-size="16:9">
<h2 id="where-to-go-next">Where to go next</h2>
<ul>
<li><strong>Docs</strong>: <a href="https://qilimanjaro-tech.github.io/qprogram">qilimanjaro-tech.github.io/qprogram</a> · <strong>Source</strong>: <a href="https://github.com/qilimanjaro-tech/qprogram">github.com/qilimanjaro-tech/qprogram</a></li>
<li>The published Reference section is the normative material, <code>docs/reference/qp-format.md</code> covers the text format, and <code>src/qprogram/grammar/qp.lark</code> is the machine-readable grammar.</li>
<li><code>qprogram-qblox</code> and <code>qprogram-qdac</code> are worked vendor extensions, and Part 5 built a rack from their profiles. Read one before you write your own.</li>
<li>Bring a rule your lab cares about and write it as a predicate. That is the cheapest way to find out whether the protocol fits your rack.</li>
<li>Issues and pull requests are welcome. The extension points are the API.</li>
</ul>
<footer>Programming a Superconducting Qubit · QCE 2026</footer>
</section>
