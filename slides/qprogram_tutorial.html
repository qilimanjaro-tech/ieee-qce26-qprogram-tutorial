<p class="sub">Pulse-Level Control and Calibration with QProgram</p>
<p class="meta">IEEE Quantum Week · QCE 2026</p>

<h2 id="introduction">Introduction</h2>
<ul>
<li><strong>Vyron Vasileiadis</strong>, Tech Lead at <strong>Qilimanjaro Quantum Tech</strong> · vyron@qilimanjaro.tech</li>
<li><strong>Qilimanjaro</strong> builds quantum computers and the software stack that drives them.</li>
<li><strong>QProgram</strong> is the pulse-level layer of that stack, an open-source Python DSL for the pulses, sweeps, and measurements a calibration is made of.</li>
</ul>
<p>Everything today runs on your laptop. QProgram ships a pure-Python reference platform, so there is<br />
no fridge to book, no vendor SDK to install, and no cloud account to create.</p>
<footer>Programming a Superconducting Qubit · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-footer="Programming a Superconducting Qubit · QCE 2026" lang="en-US" data-marpit-pagination="3" style="--paginate:true;--footer:Programming a Superconducting Qubit · QCE 2026;" data-marpit-pagination-total="49" data-size="16:9">
<h2 id="a-chip-arrives-with-no-numbers-on-it">A chip arrives with no numbers on it</h2>
<p>A circuit says <code>X(q0)</code>. To emit that pulse, an instrument has to be told:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">40 ns DRAG envelope,  IQ pair,  carrier 4.8501 GHz,  amplitude 0.6176,  sigma 10 ns,  beta 0.1
</code></pre>
<p>Six numbers. <strong>Every one of them was measured</strong>, on this chip, this week, by somebody running a<br />
scan that has no gate-level spelling. Before the first circuit runs, twelve of those scans have to<br />
succeed in order, each one consuming the answer from the last:</p>
<p class="big">resonator → qubit → π pulse → coherence → readout → reset</p>
<p>And the numbers move. Qubit frequencies wander with flux noise and with whatever two-level defects<br />
the oxide is hosting this week. A <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>π</mi></mrow><annotation encoding="application/x-tex">\pi</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">π</span></span></span></span> amplitude is a <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>π</mi></mrow><annotation encoding="application/x-tex">\pi</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">π</span></span></span></span> amplitude until the attenuator drifts.</p>
<footer>Programming a Superconducting Qubit · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-footer="Programming a Superconducting Qubit · QCE 2026" lang="en-US" data-marpit-pagination="4" style="--paginate:true;--footer:Programming a Superconducting Qubit · QCE 2026;" data-marpit-pagination-total="49" data-size="16:9">
<h2 id="what-you-are-actually-programming">What you are actually programming</h2>
<p>A transmon is a circuit, not an atom. A capacitor and a Josephson junction on a silicon chip at<br />
10 mK, with unevenly spaced energy levels so the bottom two can be addressed on their own. The gap<br />
between them is 4.85 GHz, which is microwaves.</p>
<p>So you talk to it the way you talk to any microwave circuit, with voltages on coax. Each qubit has at most three lines, and each does exactly one job.</p>
<table>
<thead>
<tr>
<th>line</th>
<th>what runs on it</th>
<th>what it does</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>drive</strong></td>
<td>a microwave tone near <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>f</mi><mn>01</mn></msub></mrow><annotation encoding="application/x-tex">f_{01}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1076em;">f</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.1076em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">01</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span></td>
<td>rotates the state</td>
</tr>
<tr>
<td><strong>readout</strong></td>
<td>a microwave tone near <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>f</mi><mi>r</mi></msub></mrow><annotation encoding="application/x-tex">f_r</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1076em;">f</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:-0.1076em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0278em;">r</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span></td>
<td>interrogates a resonator coupled to the qubit</td>
</tr>
<tr>
<td><strong>flux</strong></td>
<td>a slow, near-DC voltage</td>
<td>moves <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>f</mi><mn>01</mn></msub></mrow><annotation encoding="application/x-tex">f_{01}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1076em;">f</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.1076em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">01</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span></td>
</tr>
</tbody>
</table>
<p><strong>Every operation in this tutorial puts a voltage on one of those, or records what comes back.</strong></p>
<footer>Programming a Superconducting Qubit · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-footer="Programming a Superconducting Qubit · QCE 2026" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--footer:Programming a Superconducting Qubit · QCE 2026;" data-marpit-pagination-total="49" data-size="16:9">
<h2 id="from-a-gate-to-a-voltage-and-back">From a gate to a voltage and back</h2>
<p><img src="img/rack.svg" alt="" style="height:470px;" /></p>
<p class="cap">Three lines down, one line back. Attenuators on the way in because the chip needs microwatts, not watts; amplifiers on the way out because a few photons have to survive the trip to an ADC.</p>
<footer>Programming a Superconducting Qubit · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-footer="Programming a Superconducting Qubit · QCE 2026" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--footer:Programming a Superconducting Qubit · QCE 2026;" data-marpit-pagination-total="49" data-size="16:9">
<h2 id="what-a-gate-turns-into">What a gate turns into</h2>
<ul>
<li><strong><code>X</code></strong> is a shaped burst on the drive line. Its <strong>area</strong> sets the rotation angle, its <strong>phase</strong><br />
sets the axis. So <code>Y</code> is the same burst at 90 degrees, and <code>X/2</code> is half the amplitude. One<br />
envelope, two knobs, every single-qubit rotation.</li>
<li><strong><code>Z(θ)</code> plays nothing at all.</strong> A <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>Z</mi></mrow><annotation encoding="application/x-tex">Z</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0715em;">Z</span></span></span></span> rotation is a change of reference frame: advance the phase<br />
of every later pulse on that line and the qubit cannot tell. Zero duration, zero error. Compilers<br />
push every <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>Z</mi></mrow><annotation encoding="application/x-tex">Z</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0715em;">Z</span></span></span></span> they can into that bookkeeping.</li>
<li><strong><code>CZ</code> is not a single-line operation.</strong> Either a flux excursion that pushes one qubit into its<br />
neighbour, or a second microwave tone. 40 to 500 ns, calibrated per pair.</li>
</ul>
<blockquote>
<p>Which leaves one gate unaccounted for, and it is the one that behaves least like its symbol.</p>
</blockquote>
<footer>Programming a Superconducting Qubit · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-footer="Programming a Superconducting Qubit · QCE 2026" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--footer:Programming a Superconducting Qubit · QCE 2026;" data-marpit-pagination-total="49" data-size="16:9">
<h2 id="what-measureq0-actually-returns">What <code>measure(q0)</code> actually returns</h2>
<p><strong>Not a bit.</strong></p>
<p>You cannot see the qubit. You see a <strong>resonator</strong> coupled to it, whose frequency depends on the<br />
qubit's state. The two frequencies sit <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>2</mn><mi>χ</mi><mo>=</mo><mn>3.6</mn></mrow><annotation encoding="application/x-tex">2\chi = 3.6</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8389em;vertical-align:-0.1944em;"></span><span class="mord">2</span><span class="mord mathnormal">χ</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">3.6</span></span></span></span> MHz apart.</p>
<p>Send a tone past it. The returning field carries a state-dependent amplitude and phase, it is a few<br />
tens of photons, and it climbs an amplifier chain before being digitized, multiplied by integration<br />
weights, and summed into <strong>one complex number</strong>. Many shots give two clouds in the IQ plane. A<br />
threshold between them is its own calibration, and Part 4 does it.</p>
<ul>
<li><strong>2 microseconds</strong>, roughly 50 times longer than a gate</li>
<li><strong>around 1% error</strong>, ten to a hundred times worse than a good gate</li>
<li><strong>non-demolition</strong>: the qubit is left in the state you just measured, and Part 4's active reset is built on that</li>
</ul>
<footer>Programming a Superconducting Qubit · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-footer="Programming a Superconducting Qubit · QCE 2026" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--footer:Programming a Superconducting Qubit · QCE 2026;" data-marpit-pagination-total="49" data-size="16:9">
<h2 id="the-gates-you-cannot-write">The gates you cannot write</h2>
<p>There is no circuit-level way to say any of this:</p>
<table>
<thead>
<tr>
<th>What the experiment needs</th>
<th>Why no gate covers it</th>
</tr>
</thead>
<tbody>
<tr>
<td>step a carrier over 81 points near 7.2 GHz</td>
<td>you do not know where the resonator is yet</td>
</tr>
<tr>
<td>a 2 us readout tone plus integration weights</td>
<td>the cavity fills in <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>1</mn><mi mathvariant="normal">/</mi><mi>κ</mi><mo>≈</mo><mn>100</mn></mrow><annotation encoding="application/x-tex">1/\kappa \approx 100</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">1/</span><span class="mord mathnormal">κ</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">≈</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">100</span></span></span></span> ns and the signal is a few photons</td>
</tr>
<tr>
<td>wait 8 us, then measure</td>
<td>that is one point of a <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>T</mi><mn>1</mn></msub></mrow><annotation encoding="application/x-tex">T_1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">1</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span> curve</td>
</tr>
<tr>
<td>measure, then <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>π</mi></mrow><annotation encoding="application/x-tex">\pi</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">π</span></span></span></span>-pulse <strong>only if</strong> it read 1</td>
<td>passive reset costs <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>5</mn><msub><mi>T</mi><mn>1</mn></msub></mrow><annotation encoding="application/x-tex">5T_1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord">5</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">1</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span>, and that is 97% of your fridge time</td>
</tr>
<tr>
<td>hold the flux line at <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>+</mo><mn>50</mn></mrow><annotation encoding="application/x-tex">+50</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">+</span><span class="mord">50</span></span></span></span> mV while the drive sweeps</td>
<td>the sweet spot is where <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msubsup><mi>T</mi><mn>2</mn><mo>∗</mo></msubsup></mrow><annotation encoding="application/x-tex">T_2^*</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.9368em;vertical-align:-0.2481em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.6887em;"><span style="top:-2.4519em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mbin mtight">∗</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2481em;"><span></span></span></span></span></span></span></span></span></span> lives</td>
</tr>
</tbody>
</table>
<p><strong>Calibration is where lab time goes</strong>, and calibration lives entirely below the gate.</p>
<footer>Programming a Superconducting Qubit · QCE 2026</footer>
</section>

<h2 id="the-state-of-control-software-in-2026">The state of control software in 2026</h2>
<p>Physics moves between labs. You read a paper, you reproduce the measurement, nobody ships you a<br />
machine.</p>
<p><strong>Control code has never moved at all.</strong> Every vendor ships its own sequencer dialect, and they are<br />
all assembly-shaped for good reasons: an FPGA has to hit a 4 ns clock edge without asking permission.<br />
Register loops, cycle-counted branches, hand-addressed waveform memory. Correct, fast, welded to one<br />
box.</p>
<p>And one decision gets hard-coded on line one of every script: <strong>which loops run in the sequencer<br />
and which run on the control PC</strong>. A fact about the rack, not about the experiment, and getting it<br />
wrong costs a factor of a hundred in wall clock.</p>
<blockquote>
<p>A second rack means rewriting experiments that were already correct, then spending a month<br />
re-earning trust in them.</p>
</blockquote>
<footer>Programming a Superconducting Qubit · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-footer="Programming a Superconducting Qubit · QCE 2026" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--footer:Programming a Superconducting Qubit · QCE 2026;" data-marpit-pagination-total="49" data-size="16:9">
<h2 id="what-qprogram-is-and-what-it-leaves-alone">What QProgram is, and what it leaves alone</h2>
<ul>
<li>A Python builder that produces an <strong>AST</strong>. <code>program.play(...)</code> appends a node; it does not send bytes.</li>
<li>A <strong>text format</strong>, <code>.qp</code>, that the tree round-trips through exactly, so an experiment is a file you can diff, review, and rerun next year.</li>
<li>A <strong>capability protocol</strong>: a platform declares what it supports per bus and per domain, and a program is checked against that before anything reaches hardware.</li>
<li>A <strong>reference platform</strong> that interprets the tree in pure Python. It is the oracle vendor compilers get tested against, so &quot;did my compiler get this right&quot; becomes a question with an answer.</li>
</ul>
<p>It is not a compiler, a scheduler, or a physics model. Those stay with the vendor, behind one<br />
interface of six methods.</p>
<footer>Programming a Superconducting Qubit · QCE 2026</footer>
</section>

<p>They are not independent, and Part 1 spends five minutes on how they constrain each other.<br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>2</mn><mi>χ</mi><mi mathvariant="normal">/</mi><mi>κ</mi></mrow><annotation encoding="application/x-tex">2\chi/\kappa</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">2</span><span class="mord mathnormal">χ</span><span class="mord">/</span><span class="mord mathnormal">κ</span></span></span></span> decides whether readout works at all. <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>1</mn><mi mathvariant="normal">/</mi><msub><mi>T</mi><mn>2</mn></msub><mo>=</mo><mn>1</mn><mi mathvariant="normal">/</mi><mn>2</mn><msub><mi>T</mi><mn>1</mn></msub><mo>+</mo><mn>1</mn><mi mathvariant="normal">/</mi><msub><mi>T</mi><mi>φ</mi></msub></mrow><annotation encoding="application/x-tex">1/T_2 = 1/2T_1 + 1/T_\varphi</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">1/</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">1/2</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">1</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1.0361em;vertical-align:-0.2861em;"></span><span class="mord">1/</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">φ</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2861em;"><span></span></span></span></span></span></span></span></span></span> says <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>T</mi><mn>2</mn></msub></mrow><annotation encoding="application/x-tex">T_2</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span> can<br />
never pass 36 us here. And <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>κ</mi></mrow><annotation encoding="application/x-tex">\kappa</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal">κ</span></span></span></span> fixes the cavity fill time at 106 ns, which is why the readout<br />
pulse is 2 us and not 200.</p>
<blockquote>
<p>Every fit you run today prints its answer next to the truth, so you can grade yourself.</p>

<h2 id="what-you-will-build">What you will build</h2>
<ul>
<li>a <strong>calibrated qubit</strong>: resonator frequency, qubit frequency, and a <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>π</mi></mrow><annotation encoding="application/x-tex">\pi</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">π</span></span></span></span> pulse, all fitted from raw sweeps (Parts 2 and 3);</li>
<li>a <strong>coherence set</strong>: <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>T</mi><mn>1</mn></msub></mrow><annotation encoding="application/x-tex">T_1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">1</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span>, <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msubsup><mi>T</mi><mn>2</mn><mo lspace="0em" rspace="0em">∗</mo></msubsup></mrow><annotation encoding="application/x-tex">T_2^{*}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.9368em;vertical-align:-0.2481em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.6887em;"><span style="top:-2.4519em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">∗</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2481em;"><span></span></span></span></span></span></span></span></span></span>, and <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>T</mi><mn>2</mn></msub></mrow><annotation encoding="application/x-tex">T_2</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span> from echo, built out of reusable pulse fragments (Part 4);</li>
<li><strong>single-shot readout</strong> with a threshold, and <strong>active reset</strong> that reads the outcome and acts on it (Part 4);</li>
<li>the <strong>same calibration ported to a second rack</strong>, checked against that rack before it runs (Part 5);</li>
<li>your <strong>own waveform, sweep source, and vendor operation</strong>, then the whole bring-up as one script (Part 6).</li>
</ul>
<p>By the end, a directory of <code>.qp</code> files and one <code>.wfl</code> library that another lab could load.</p>
<footer>Programming a Superconducting Qubit · QCE 2026</footer>
</section>

<h2 id="the-architecture">The architecture</h2>
<p><img src="img/stack.svg" alt="" style="height:480px;" /></p>
<p class="cap">Your script builds a tree. Validation decides what runs where. The platform compiles and runs it. The <code>.qp</code> and <code>.wfl</code> files fall out as artifacts.</p>
<footer>Programming a Superconducting Qubit · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-footer="Programming a Superconducting Qubit · QCE 2026" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--footer:Programming a Superconducting Qubit · QCE 2026;" data-marpit-pagination-total="49" data-size="16:9">
<h2 id="a-bus-is-one-signal-path">A bus is one signal path</h2>
<p><img src="img/buses.svg" alt="" style="height:470px;" /></p>
<p class="cap">One qubit owns three lines that share nothing, and one feedline carries every readout at once. So operations name the <em>line</em>, never the qubit.</p>
<footer>Programming a Superconducting Qubit · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-footer="Programming a Superconducting Qubit · QCE 2026" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--footer:Programming a Superconducting Qubit · QCE 2026;" data-marpit-pagination-total="49" data-size="16:9">
<h2 id="30-seconds-of-vocabulary">30 seconds of vocabulary</h2>
<ul>
<li><strong>Bus</strong>: a named signal path, <code>q[0].drive</code>. A string that also knows its channel type and whether it can acquire. Those two fields reject an IQ pulse on a flux line and a <code>measure</code> on a line with no ADC, at build time.</li>
<li><strong>Waveform</strong>: an envelope as data, <code>Gaussian(amplitude=0.3, duration=40, sigma=10)</code>. Comparable, serializable, and swappable for a string alias when the number is still being measured.</li>
<li><strong>Sweep source</strong>: what a loop iterates over. <code>Range</code>, <code>Linspace</code>, <code>Values</code>, <code>Logspace</code>, <code>File</code>. One loop block, pluggable source, and the source declares whether a sequencer can generate it.</li>
<li><strong>Average</strong>: the shot loop. It adds no dimension to the result, it averages one away.</li>
<li><strong>Measurement handle</strong>: what <code>measure()</code> returns. Use it to pull the array out, and to read <code>handle.state</code> for feedback.</li>
</ul>
<footer>Programming a Superconducting Qubit · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-footer="Programming a Superconducting Qubit · QCE 2026" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--footer:Programming a Superconducting Qubit · QCE 2026;" data-marpit-pagination-total="49" data-size="16:9">
<h2 id="one-more-word-capability">One more word: capability</h2>
<p>Three mechanisms, because three different kinds of question:</p>
<ul>
<li>A <strong>token</strong> is set membership. <code>op.play</code>, <code>waveform.iq_drag</code>, <code>sweep.logspace</code>. Cheap to check, and a set of them serializes into a profile a vendor can publish.</li>
<li>A <strong>limit</strong> is a number. <code>max_loop_nesting: 4</code> is a hard wall, because a sequencer runs loops out of registers and there is no spilling to memory.</li>
<li>A <strong>predicate</strong> is code, for rules that depend on how two nodes interact. &quot;This <code>wait</code> takes a variable, so what kind of sweep binds it?&quot; No flat token can answer that.</li>
</ul>
<p>Every slot splits into an <code>rt</code> half and a <code>host</code> half, and either may be <code>None</code>. A flux DAC with no<br />
sequencer is <code>rt=None</code>, and that one field carries the whole story.</p>
<p>Validation returns <strong>diagnostics</strong> and never raises. Alongside them comes an <strong>execution plan</strong>:<br />
every node labelled <code>[rt]</code>, <code>[host]</code>, <code>[rt|host]</code>, or <code>[--]</code>.</p>
<footer>Programming a Superconducting Qubit · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-footer="Programming a Superconducting Qubit · QCE 2026" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--footer:Programming a Superconducting Qubit · QCE 2026;" data-marpit-pagination-total="49" data-size="16:9">
<h2 id="the-simulator-honestly">The simulator, honestly</h2>
<p><code>qp.simulate(program, model=...)</code> walks the tree in Python. Loops bind variables, measurements write<br />
records. It models the <strong>shape</strong> of an experiment. Nesting, averaging, one record per <code>measure</code>,<br />
<code>NaN</code> where a conditional arm never ran.</p>
<p>It models <strong>no timing and no waveform physics</strong>. <code>wait</code> and <code>sync</code> change nothing in the numbers.<br />
A <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>T</mi><mn>1</mn></msub></mrow><annotation encoding="application/x-tex">T_1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">1</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span> curve decays because your model read <code>env[&quot;delay&quot;]</code>, not because a qubit relaxed.</p>
<p>That is a choice about what is under test. A tutorial with a Lindblad solver behind it would teach<br />
you to trust a simulation. This one puts the two things you actually carry to a fridge under test<br />
instead: <strong>the program</strong>, which has to say the right thing to a machine, and <strong>the analysis</strong>, which<br />
has to get the right number out of noisy data. Both are identical here and on hardware.</p>
<footer>Programming a Superconducting Qubit · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-footer="Programming a Superconducting Qubit · QCE 2026" data-class="divider" lang="en-US" class="divider" data-marpit-pagination="22" style="--paginate:true;--footer:Programming a Superconducting Qubit · QCE 2026;--class:divider;" data-marpit-pagination-total="49" data-size="16:9"><p class="kicker">Part 1 · notebooks/01_pulse_programs.ipynb</p>
<h1 id="the-program-is-data">The Program Is Data</h1>
<h3 id="a-readout-pulse-a-drive-pulse-and-the-tree-they-build">A readout pulse, a drive pulse, and the tree they build</h3>
<footer>Programming a Superconducting Qubit · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-footer="Programming a Superconducting Qubit · QCE 2026" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--footer:Programming a Superconducting Qubit · QCE 2026;" data-marpit-pagination-total="49" data-size="16:9">
<h2 id="part-1-the-smallest-useful-program">Part 1: the smallest useful program</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">#!QProgram 1.0
schema: transmon
body:
  set_frequency q[0].readout 7200000000.0
  measure q[0].readout IQPair(I=Square(0.2, 2000), Q=Square(0.0, 2000)) ... name=&quot;q0/readout/m0&quot;
</code></pre>
<p>Three things are already true of that text. It <strong>round-trips</strong> (<code>loads(dumps(p)).body == p.body</code>,<br />
and the notebook asserts it). It is a <strong>diff target</strong>, so two calibration runs a week apart differ<br />
by a handful of readable numbers. And it <strong>type-checks against the chip</strong>: <code>q[0].readout</code> knows it<br />
carries two channels and has an ADC, so a <code>Square</code> on a drive line and a <code>measure</code> on a line with no<br />
ADC both raise on the line that made the mistake.</p>
<p>Nothing here runs. Part 1 is build and inspect; Part 2 presses go.</p>
<footer>Programming a Superconducting Qubit · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-footer="Programming a Superconducting Qubit · QCE 2026" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--footer:Programming a Superconducting Qubit · QCE 2026;" data-marpit-pagination-total="49" data-size="16:9">
<h2 id="part-1-every-bus-keeps-its-own-clock">Part 1: every bus keeps its own clock</h2>
<p><img src="img/timing.svg" alt="" style="height:430px;" /></p>
<p class="cap">A circuit has one global clock. A pulse program does not. Each bus advances only when you write to it, and <code>sync</code> is the barrier that brings them back together.</p>
<footer>Programming a Superconducting Qubit · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-footer="Programming a Superconducting Qubit · QCE 2026" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--footer:Programming a Superconducting Qubit · QCE 2026;" data-marpit-pagination-total="49" data-size="16:9">
<h2 id="part-1-waveforms-are-data-and-the-numbers-leave-the-file">Part 1: waveforms are data, and the numbers leave the file</h2>
<p>Why 2 us of readout tone? SNR grows as <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msqrt><mi>t</mi></msqrt></mrow><annotation encoding="application/x-tex">\sqrt{t}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1.04em;vertical-align:-0.1475em;"></span><span class="mord sqrt"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.8925em;"><span class="svg-align" style="top:-3em;"><span class="pstrut" style="height:3em;"></span><span class="mord" style="padding-left:0.833em;"><span class="mord mathnormal">t</span></span></span><span style="top:-2.8525em;"><span class="pstrut" style="height:3em;"></span><span class="hide-tail" style="min-width:0.853em;height:1.08em;"><svg xmlns="http://www.w3.org/2000/svg" width="400em" height="1.08em" viewBox="0 0 400000 1080" preserveAspectRatio="xMinYMin slice"><path d="M95,702
c-2.7,0,-7.17,-2.7,-13.5,-8c-5.8,-5.3,-9.5,-10,-9.5,-14
c0,-2,0.3,-3.3,1,-4c1.3,-2.7,23.83,-20.7,67.5,-54
c44.2,-33.3,65.8,-50.3,66.5,-51c1.3,-1.3,3,-2,5,-2c4.7,0,8.7,3.3,12,10
s173,378,173,378c0.7,0,35.3,-71,104,-213c68.7,-142,137.5,-285,206.5,-429
c69,-144,104.5,-217.7,106.5,-221

s-225.272,467,-225.272,467s-235,486,-235,486c-2.7,4.7,-9,7,-19,7

M834 80h400000v40h-400000z"/></svg></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.1475em;"><span></span></span></span></span></span></span></span></span> against the amplifier chain, and the ceiling is<br />
<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>T</mi><mn>1</mn></msub></mrow><annotation encoding="application/x-tex">T_1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">1</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span>, so 2 us against 18 us is about a ninth. Why a Gaussian and not a square on the drive line?<br />
The <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">∣</mi><mn>1</mn><mo stretchy="false">⟩</mo><mo>→</mo><mi mathvariant="normal">∣</mi><mn>2</mn><mo stretchy="false">⟩</mo></mrow><annotation encoding="application/x-tex">|1\rangle \to |2\rangle</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">∣1</span><span class="mclose">⟩</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">→</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">∣2</span><span class="mclose">⟩</span></span></span></span> transition is 300 MHz away and a sharp edge puts power there.</p>
<p><code>play</code>, <code>wait</code>, <code>sync</code>, <code>set_frequency</code>, <code>set_phase</code>, <code>set_gain</code>, <code>reset_phase</code>, <code>measure</code>. Each<br />
call appends exactly one node. <code>program.body.elements</code>, <code>body.walk()</code>, <code>program.buses</code> read it back.</p>
<p>The one that matters most is a <strong>string alias</strong>: <code>play(q[0].drive, &quot;pi&quot;)</code>. A script with <code>0.6176</code><br />
inlined is a script that <em>claims</em> a calibration; run it six months later and it produces numbers<br />
that mean nothing. An alias cannot claim one, because it does not carry one.</p>
<blockquote>
<p><img class="emoji" draggable="false" alt="🧩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9e9.svg" data-marp-twemoji=""/> Build a two-qubit prepare-and-read sequence, then edit a <code>.qp</code> file by hand and prove what changed.</p>
</blockquote>

<h1 id="sweeps-averaging-and-what-comes-back">Sweeps, Averaging, and What Comes Back</h1>
<h3 id="resonator-spectroscopy-then-a-punchout-map">Resonator spectroscopy, then a punchout map</h3>
<footer>Programming a Superconducting Qubit · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-footer="Programming a Superconducting Qubit · QCE 2026" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--footer:Programming a Superconducting Qubit · QCE 2026;" data-marpit-pagination-total="49" data-size="16:9">
<h2 id="part-2-the-first-scan-on-a-new-chip">Part 2: the first scan on a new chip</h2>
<p>A resonator hangs off the feedline. Off resonance the tone sails past, on resonance the resonator<br />
absorbs it, and the trace dips. Frequency from the centre, <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>κ</mi></mrow><annotation encoding="application/x-tex">\kappa</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal">κ</span></span></span></span> from the width, and from the<br />
<strong>depth</strong>, a loss budget: 90% deep means <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>Q</mi><mi>L</mi></msub><mi mathvariant="normal">/</mi><msub><mi>Q</mi><mi>c</mi></msub><mo>=</mo><mn>0.9</mn></mrow><annotation encoding="application/x-tex">Q_L/Q_c = 0.9</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord"><span class="mord mathnormal">Q</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3283em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">L</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mord">/</span><span class="mord"><span class="mord mathnormal">Q</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">c</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">0.9</span></span></span></span>, so <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>Q</mi><mi>i</mi></msub><mo>=</mo><mn>48000</mn></mrow><annotation encoding="application/x-tex">Q_i = 48000</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8778em;vertical-align:-0.1944em;"></span><span class="mord"><span class="mord mathnormal">Q</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">i</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">48000</span></span></span></span> against <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>Q</mi><mi>L</mi></msub><mo>=</mo><mn>4800</mn></mrow><annotation encoding="application/x-tex">Q_L = 4800</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8778em;vertical-align:-0.1944em;"></span><span class="mord"><span class="mord mathnormal">Q</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3283em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">L</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">4800</span></span></span></span>.<br />
Overcoupled by ten, the right direction. A shallow dip means <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>Q</mi><mi>i</mi></msub></mrow><annotation encoding="application/x-tex">Q_i</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8778em;vertical-align:-0.1944em;"></span><span class="mord"><span class="mord mathnormal">Q</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">i</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span> collapsed.</p>
<p>You need a hole in the program, because a resonator's frequency depends on the kinetic inductance of<br />
whatever film got sputtered that day, and the fab does not know it to better than a percent. One<br />
percent of 7.2 GHz is 72 MHz against a 1.5 MHz linewidth.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">freq = program.variable(<span class="hljs-string">&quot;ro_freq&quot;</span>)
<span class="hljs-keyword">with</span> program.average(shots=<span class="hljs-number">200</span>):
    <span class="hljs-keyword">with</span> program.sweep(freq, qp.Range(<span class="hljs-number">7.19e9</span>, <span class="hljs-number">7.21e9</span>, <span class="hljs-number">0.2e6</span>)):   <span class="hljs-comment"># 101 points, not 100</span>
</code></pre>
<p><code>average</code> adds <strong>no</strong> dimension: <code>iq</code> becomes a mean, <code>state</code> becomes a population.</p>
<footer>Programming a Superconducting Qubit · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-footer="Programming a Superconducting Qubit · QCE 2026" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--footer:Programming a Superconducting Qubit · QCE 2026;" data-marpit-pagination-total="49" data-size="16:9">
<h2 id="part-2-what-a-sweep-costs-three-ways">Part 2: what a sweep costs, three ways</h2>
<p>The scan above is 101 points x 200 shots = 20,200 executions of the sequence.</p>
<table>
<thead>
<tr>
<th>where the loop runs</th>
<th>one execution</th>
<th>the scan</th>
</tr>
</thead>
<tbody>
<tr>
<td>sequencer, passive reset</td>
<td>2 us readout + <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>5</mn><msub><mi>T</mi><mn>1</mn></msub></mrow><annotation encoding="application/x-tex">5T_1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord">5</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">1</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span> = 100 us</td>
<td><strong>2 s</strong></td>
</tr>
<tr>
<td>sequencer, active reset (Part 4)</td>
<td>a few us</td>
<td><strong>0.2 s</strong></td>
</tr>
<tr>
<td>host, one round trip per point</td>
<td>~1 ms through driver and Python</td>
<td><strong>20 s</strong></td>
</tr>
</tbody>
</table>
<p>That factor of a hundred is why a sweep source declares <code>KIND</code> instead of just handing over a list.<br />
<code>Range</code> and <code>Linspace</code> are <code>linear</code>, so a sequencer can run them from a register. <code>Values</code>,<br />
<code>Logspace</code>, and <code>File</code> are <code>arbitrary</code>, and <code>Values</code> stays arbitrary even when its numbers are<br />
evenly spaced, because a list of floats proves nothing about its own regularity.</p>
<blockquote>
<p><img class="emoji" draggable="false" alt="🧩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9e9.svg" data-marp-twemoji=""/> Take the power axis log-spaced with <code>qp.Logspace</code>, then write the scan as a parallel pair and explain the dims.</p>
</blockquote>
<footer>Programming a Superconducting Qubit · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-footer="Programming a Superconducting Qubit · QCE 2026" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--footer:Programming a Superconducting Qubit · QCE 2026;" data-marpit-pagination-total="49" data-size="16:9">
<h2 id="part-2-punchout-and-the-37-photons">Part 2: punchout, and the 37 photons</h2>
<p>Dispersive readout works because qubit and resonator are coupled but far apart, so they shift each<br />
other without exchanging energy. That approximation has a validity limit, and it is a photon number:</p>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>n</mi><mtext>crit</mtext></msub><mo>=</mo><mfrac><msup><mi mathvariant="normal">Δ</mi><mn>2</mn></msup><mrow><mn>4</mn><msup><mi>g</mi><mn>2</mn></msup></mrow></mfrac><mo>≈</mo><mn>37</mn><mtext> photons on this chip</mtext></mrow><annotation encoding="application/x-tex">n_{\text{crit}} = \frac{\Delta^2}{4g^2} \approx 37 \ \text{photons on this chip}
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.5806em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal">n</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3175em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord text mtight"><span class="mord mtight">crit</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:2.3715em;vertical-align:-0.8804em;"></span><span class="mord"><span class="mopen nulldelimiter"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.4911em;"><span style="top:-2.314em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord">4</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">g</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.7401em;"><span style="top:-2.989em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span></span></span></span></span></span></span><span style="top:-3.23em;"><span class="pstrut" style="height:3em;"></span><span class="frac-line" style="border-bottom-width:0.04em;"></span></span><span style="top:-3.677em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord"><span class="mord">Δ</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span></span></span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.8804em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">≈</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="mord">37</span><span class="mspace"> </span><span class="mord text"><span class="mord">photons on this chip</span></span></span></span></span></span></p><p>Below it, the resonator sits at <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>f</mi><mi>r</mi></msub><mo>+</mo><mi>χ</mi></mrow><annotation encoding="application/x-tex">f_r + \chi</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1076em;">f</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:-0.1076em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0278em;">r</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord mathnormal">χ</span></span></span></span>. Above it, the pull washes out and the resonator lands<br />
on bare <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>f</mi><mi>r</mi></msub></mrow><annotation encoding="application/x-tex">f_r</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1076em;">f</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:-0.1076em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0278em;">r</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span>. The 2D map of that crossover is how you pick a readout power: as many photons as you<br />
can for SNR, few enough that there are still two states to tell apart.</p>
<p>Nested <code>with</code> statements are nested loops. <code>result.get(m0)</code> comes back as <code>xarray</code> with dims<br />
<code>(&quot;ro_amp&quot;, &quot;ro_freq&quot;, &quot;IQ&quot;)</code>, outermost sweep first, named after your variable ids.<br />
<code>sweep(a) | sweep(b)</code> steps two in lockstep and yields one dim <code>&quot;a|b&quot;</code>: a diagonal cut, not a grid.</p>
<footer>Programming a Superconducting Qubit · QCE 2026</footer>

<h2 id="anatomy-of-a-rabi-program">Anatomy of a Rabi program</h2>
<p><img src="img/anatomy.svg" alt="" style="height:430px;" /></p>
<p class="cap">Every node contributes something to the answer: <code>sweep</code> creates an axis, <code>average</code> collapses one, <code>measure</code> creates a record, <code>play</code> carries the variable into the waveform.</p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-footer="Programming a Superconducting Qubit · QCE 2026" data-class="divider" lang="en-US" class="divider" data-marpit-pagination="31" style="--paginate:true;--footer:Programming a Superconducting Qubit · QCE 2026;--class:divider;" data-marpit-pagination-total="49" data-size="16:9"><p class="kicker">Part 3 · notebooks/03_finding_the_qubit.ipynb</p>
<h1 id="finding-and-driving-the-qubit">Finding and Driving the Qubit</h1>
<h3 id="two-tone-spectroscopy-rabi-and-the-flux-arc">Two-tone spectroscopy, Rabi, and the flux arc</h3>
<footer>Programming a Superconducting Qubit · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-footer="Programming a Superconducting Qubit · QCE 2026" lang="en-US" data-marpit-pagination="32" style="--paginate:true;--footer:Programming a Superconducting Qubit · QCE 2026;" data-marpit-pagination-total="49" data-size="16:9">
<h2 id="part-3-you-cannot-see-the-qubit-directly">Part 3: you cannot see the qubit directly</h2>
<p>Nothing you send at 7.2 GHz touches something at 4.85 GHz, and the drive line has no ADC. The qubit<br />
is only ever observed <strong>through</strong> the resonator, and only because of <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>χ</mi></mrow><annotation encoding="application/x-tex">\chi</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord mathnormal">χ</span></span></span></span>.</p>
<p>So run two tones. Park the readout in the dip, sweep a second tone on the drive line, and when it<br />
hits <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>f</mi><mn>01</mn></msub></mrow><annotation encoding="application/x-tex">f_{01}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1076em;">f</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.1076em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">01</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span> the qubit excites, the resonator moves by <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>2</mn><mi>χ</mi><mo>=</mo><mn>3.6</mn></mrow><annotation encoding="application/x-tex">2\chi = 3.6</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8389em;vertical-align:-0.1944em;"></span><span class="mord">2</span><span class="mord mathnormal">χ</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">3.6</span></span></span></span> MHz against a 1.5 MHz<br />
linewidth, and the tone that was in the dip is suddenly off it.</p>
<p>That chain read backwards is why Part 2 comes first, in the tutorial and in the lab.</p>
<p><strong>A saturated transition tops out at 0.5.</strong> Equal populations, no matter how hard you push. See a<br />
two-tone peak above 0.5 and your readout classifier is wrong, not your qubit. <code>measure(..., fields=(MF.STATE,))</code> asks for classified outcomes; <code>average</code> turns them into that population.</p>
<footer>Programming a Superconducting Qubit · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-footer="Programming a Superconducting Qubit · QCE 2026" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--footer:Programming a Superconducting Qubit · QCE 2026;" data-marpit-pagination-total="49" data-size="16:9">
<h2 id="part-3-rabi-and-the-number-the-rest-of-the-day-depends-on">Part 3: Rabi, and the number the rest of the day depends on</h2>
<p>Fix the shape, sweep the amplitude, and the rotation angle is proportional to it, so the population<br />
traces <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mrow><mi>sin</mi><mo>⁡</mo></mrow><mn>2</mn></msup></mrow><annotation encoding="application/x-tex">\sin^2</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8719em;"></span><span class="mop"><span class="mop">sin</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8719em;"><span style="top:-3.1208em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span></span></span></span></span></span></span></span> and the first maximum is the <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>π</mi></mrow><annotation encoding="application/x-tex">\pi</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">π</span></span></span></span> pulse. Ceiling of 1 this time, because this is a<br />
coherent rotation and not a pumped steady state.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">a_pi fitted : 0.6176 +/- 0.0021        contrast: 0.997   floor: 0.002
a_pi true   : 0.6200
</code></pre>
<p>Fit for the parameter you want, not a generic sinusoid, and <code>curve_fit</code> hands you the error bar on<br />
the number you care about. The contrast and floor come free and are a weekly health check: a floor<br />
that creeps up means a warm qubit or a drifting classifier.</p>
<p>The variable lives <strong>inside the waveform</strong>, <code>IQDrag(amplitude=amp, ...)</code>, so the file records one<br />
parametric pulse rather than 41 literal ones. The fitted result becomes the alias <code>&quot;pi&quot;</code> through<br />
<code>with_waveforms(...)</code>, and the program text holds still while the calibration moves.</p>
<footer>Programming a Superconducting Qubit · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-footer="Programming a Superconducting Qubit · QCE 2026" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--footer:Programming a Superconducting Qubit · QCE 2026;" data-marpit-pagination-total="49" data-size="16:9">
<h2 id="part-3-the-flux-arc-and-a-loop-you-never-classified">Part 3: the flux arc, and a loop you never classified</h2>
<p>A SQUID's Josephson energy goes as <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">∣</mi><mi>cos</mi><mo>⁡</mo><mo stretchy="false">(</mo><mi>π</mi><mi mathvariant="normal">Φ</mi><mi mathvariant="normal">/</mi><msub><mi mathvariant="normal">Φ</mi><mn>0</mn></msub><mo stretchy="false">)</mo><mi mathvariant="normal">∣</mi></mrow><annotation encoding="application/x-tex">|\cos(\pi\Phi/\Phi_0)|</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">∣</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mop">cos</span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.0359em;">π</span><span class="mord">Φ/</span><span class="mord"><span class="mord">Φ</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">0</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mclose">)</span><span class="mord">∣</span></span></span></span> and <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>f</mi><mn>01</mn></msub><mo>∝</mo><msqrt><msub><mi>E</mi><mi>J</mi></msub></msqrt></mrow><annotation encoding="application/x-tex">f_{01} \propto \sqrt{E_J}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1076em;">f</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.1076em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">01</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">∝</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1.04em;vertical-align:-0.1883em;"></span><span class="mord sqrt"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.8517em;"><span class="svg-align" style="top:-3em;"><span class="pstrut" style="height:3em;"></span><span class="mord" style="padding-left:0.833em;"><span class="mord"><span class="mord mathnormal" style="margin-right:0.0576em;">E</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3283em;"><span style="top:-2.55em;margin-left:-0.0576em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0962em;">J</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span><span style="top:-2.8117em;"><span class="pstrut" style="height:3em;"></span><span class="hide-tail" style="min-width:0.853em;height:1.08em;"><svg xmlns="http://www.w3.org/2000/svg" width="400em" height="1.08em" viewBox="0 0 400000 1080" preserveAspectRatio="xMinYMin slice"><path d does nothing, and that is where every coherence number in Part 4 gets measured.</p>
<p>Now look at what the program says. Two <code>for</code> loops written identically. The inner one retunes a<br />
source and fires a pulse, microseconds per step. The outer one writes a DC voltage into a filtered<br />
line that settles in milliseconds, on a box with no sequencer in it.</p>
<p><strong>You never wrote down which was which</strong>, and you should not have to. Hold that until Part 5.</p>

file too.</p>

<h2 id="part-4-single-shots-and-an-error-that-falls-off-a-cliff">Part 4: single shots, and an error that falls off a cliff</h2>
<p>Stop averaging: put the shot index in an explicit <code>sweep</code> and every shot lands in the array. Two<br />
clouds appear, because the resonator sits at <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>f</mi><mi>r</mi></msub><mo>±</mo><mi>χ</mi></mrow><annotation encoding="application/x-tex">f_r \pm \chi</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1076em;">f</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:-0.1076em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0278em;">r</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">±</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord mathnormal">χ</span></span></span></span> and the integrated point lands in one of<br />
two places.</p>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>ε</mi><mo>=</mo><mstyle scriptlevel="0" displaystyle="false"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mtext> </mtext><mrow><mi mathvariant="normal">e</mi><mi mathvariant="normal">r</mi><mi mathvariant="normal">f</mi><mi mathvariant="normal">c</mi></mrow><mtext> ⁣</mtext><mrow><mo fence="true">(</mo><mfrac><mi>d</mi><mrow><mn>2</mn><msqrt><mn>2</mn></msqrt><mi>σ</mi></mrow></mfrac><mo fence="true">)</mo></mrow><mspace width="2em"/><mn>4</mn><mi>σ</mi><mo>→</mo><mn>2</mn><mi mathvariant="normal">%</mi><mspace width="2em"/><mn>6</mn><mi>σ</mi><mo>→</mo><mn>0.1</mn><mi mathvariant="normal">%</mi></mrow><annotation encoding="application/x-tex">\varepsilon = \tfrac{1}{2}\,\mathrm{erfc}\!\left(\frac{d}{2\sqrt{2}\sigma}\right)

is the whole of readout engineering, and the steepness is why every factor of two feels like a<br />
