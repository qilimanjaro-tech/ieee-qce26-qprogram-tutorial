<h2 id="six-measured-numbers">Six measured numbers</h2>
<p>A circuit says <code>X(q0)</code>. Before an instrument can emit it, somebody has to supply this.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">40 ns DRAG envelope,  IQ pair,  carrier 4.8500 GHz,  amplitude 0.6200,  sigma 10 ns,  beta 0.15
</code></pre>
<ul>
<li>Nothing in <code>X(q0)</code> names a line, a carrier, or an envelope.</li>
<li>The carrier and the amplitude came out of their own scans, and the rest are choices.</li>
<li>They drift, so the scans are run again.</li>
</ul>
<footer>Pulse-level Programming with QProgram · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-footer="Pulse-level Programming with QProgram · QCE 2026" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--footer:Pulse-level Programming with QProgram · QCE 2026;" data-marpit-pagination-total="81" data-size="16:9">
<h2 id="calibration-order">Calibration order</h2>
<p class="big">resonator → qubit → π pulse → coherence → readout → reset</p>
<ul>
<li>Each scan consumes the answer from the one before it.</li>
<li>You cannot find the qubit before you can read it out.</li>
<li>You cannot fit a <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>π</mi></mrow><annotation encoding="application/x-tex">\pi</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">π</span></span></span></span> amplitude before you know where the qubit is.</li>
</ul>
<footer>Pulse-level Programming with QProgram · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-footer="Pulse-level Programming with QProgram · QCE 2026" data-class="divider" lang="en-US" class="divider" data-marpit-pagination="34" style="--paginate:true;--footer:Pulse-level Programming with QProgram · QCE 2026;--class:divider;" data-marpit-pagination-total="81" data-size="16:9"><p class="kicker">Concepts · slides only</p>
<h1 id="why-a-language-of-its-own">Why a language of its own</h1>
<h3 id="six-requirements-and-what-a-vendor-dialect-does-to-them">Six requirements, and what a vendor dialect does to them</h3>
<footer>Pulse-level Programming with QProgram · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-footer="Pulse-level Programming with QProgram · QCE 2026" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--footer:Pulse-level Programming with QProgram · QCE 2026;" data-marpit-pagination-total="81" data-size="16:9">
<h2 id="six-requirements">Six requirements</h2>
<ul>
<li><strong>Timed waveforms on named lines</strong>, not gates on qubits.</li>
<li><strong>A clock per line</strong>, with barriers as explicit instructions.</li>
<li><strong>Parameter sweeps</strong>, nested or stepped in lockstep.</li>
<li><strong>Shot averaging</strong>, collapsing repeats into one number.</li>
<li><strong>Acquisition with weights</strong>, and a choice of what to keep.</li>
<li><strong>A branch on a measurement</strong>, inside the shot.</li>
</ul>
<footer>Pulse-level Programming with QProgram · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-footer="Pulse-level Programming with QProgram · QCE 2026" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--footer:Pulse-level Programming with QProgram · QCE 2026;" data-marpit-pagination-total="81" data-size="16:9">
<h2 id="one-dialect-per-rack">One dialect per rack</h2>
<ul>
<li>A paper travels between labs, and the control code behind it stays in the lab that wrote it.</li>
<li>Every vendor ships its own sequencer dialect.</li>
<li>They are assembly shaped, because an FPGA has to meet every clock edge.</li>
<li>Loops come out of registers, and waveform memory is addressed by hand.</li>
<li>Porting to a second rack means rewriting experiments that were already correct.</li>
</ul>
<footer>Pulse-level Programming with QProgram · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-footer="Pulse-level Programming with QProgram · QCE 2026" lang="en-US" data-marpit-pagination="37" style="--paginate:true;--footer:Pulse-level Programming with QProgram · QCE 2026;" data-marpit-pagination-total="81" data-size="16:9">
<h2 id="the-loop-decision">The loop decision</h2>
<ul>
<li>Each script hard codes which loops run in the sequencer.</li>
<li>Whatever is left runs on the host, one round trip per step.</li>
<li>Running on the host can cost a factor of a hundred.</li>
<li>The choice belongs to the rack, so it should not sit in the file.</li>
</ul>
<footer>Pulse-level Programming with QProgram · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-footer="Pulse-level Programming with QProgram · QCE 2026" lang="en-US" data-marpit-pagination="38" style="--paginate:true;--footer:Pulse-level Programming with QProgram · QCE 2026;" data-marpit-pagination-total="81" data-size="16:9">
<h2 id="a-python-dsl">A Python DSL</h2>
<ul>
<li>The experiment goes in the file, the rack stays outside it.</li>
<li>QProgram is a Python builder that produces an AST.</li>
<li><code>program.play(...)</code> appends a typed <code>Play</code> node and sends nothing.</li>
<li>Every other tool in the library reads that one tree.</li>
<li>Not a compiler or a scheduler, since those sit behind <code>PlatformProtocol</code>.</li>
</ul>
<footer>Pulse-level Programming with QProgram · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-footer="Pulse-level Programming with QProgram · QCE 2026" lang="en-US" data-marpit-pagination="39" style="--paginate:true;--footer:Pulse-level Programming with QProgram · QCE 2026;" data-marpit-pagination-total="81" data-size="16:9">
<h2 id="the-architecture">The architecture</h2>
<p><img src="img/stack.svg" alt="" style="height:480px;" /></p>
<p class="cap">Your script builds a tree, a platform runs that tree, and files fall out as artifacts.</p>
<footer>Pulse-level Programming with QProgram · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-footer="Pulse-level Programming with QProgram · QCE 2026" data-class="divider" lang="en-US" class="divider" data-marpit-pagination="40" style="--paginate:true;--footer:Pulse-level Programming with QProgram · QCE 2026;--class:divider;" data-marpit-pagination-total="81" data-size="16:9"><p class="kicker">Part 1 · notebooks/01_introduction.ipynb</p>
<h1 id="the-program-is-data">The program is data</h1>
<h3 id="the-operations-the-lines-they-run-on-the-shapes-they-play-and-the-file-they-save-to">The operations, the lines they run on, the shapes they play, and the file they save to</h3>
<footer>Pulse-level Programming with QProgram · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-footer="Pulse-level Programming with QProgram · QCE 2026" lang="en-US" data-marpit-pagination="41" style="--paginate:true;--footer:Pulse-level Programming with QProgram · QCE 2026;" data-marpit-pagination-total="81" data-size="16:9">
<h2 id="a-program-is-a-value">A program is a value</h2>
<ul>
<li>Every operation you call appends one typed node to a tree and sends nothing anywhere.</li>
<li>So what you hold afterwards is data your own code can print, compare, rewrite and save.</li>
<li>Containers nest, and the nesting in the file is the nesting in the result.</li>
<li>A program can therefore be checked and refused before an instrument exists.</li>
</ul>
<footer>Pulse-level Programming with QProgram · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-footer="Pulse-level Programming with QProgram · QCE 2026" lang="en-US" data-marpit-pagination="42" style="--paginate:true;--footer:Pulse-level Programming with QProgram · QCE 2026;" data-marpit-pagination-total="81" data-size="16:9">
<h2 id="one-signal-path">One signal path</h2>
<p><img src="img/buses.svg" alt="" style="height:300px;" /></p>
<ul>
<li>A bus is one signal path, from an instrument port to the chip.</li>
<li>One qubit owns three lines that have nothing in common with each other.</li>
<li>One feedline carries every readout at once, each on its own frequency.</li>
<li>So an operation names the line, never the qubit.</li>
</ul>
<footer>Pulse-level Programming with QProgram · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-footer="Pulse-level Programming with QProgram · QCE 2026" lang="en-US" data-marpit-pagination="43" style="--paginate:true;--footer:Pulse-level Programming with QProgram · QCE 2026;" data-marpit-pagination-total="81" data-size="16:9">
<h2 id="every-call-names-a-property">Every call names a property</h2>
<table>
<thead>
<tr>
<th>what a call does</th>
<th>the calls</th>
</tr>
</thead>
<tbody>
<tr>
<td>book time on a line</td>
<td><code>play</code>, <code>measure</code>, <code>wait</code></td>
</tr>
<tr>
<td>bring lines to a common time</td>
<td><code>sync</code></td>
</tr>
<tr>
<td>set or read one property of a line</td>
<td><code>set_frequency</code>, <code>set_phase</code>, <code>reset_phase</code>, <code>set_gain</code>, <code>set_offset</code>, <code>set_parameter</code>, <code>get_parameter</code></td>
</tr>
<tr>
<td>run a named sub-program</td>
<td><code>call</code></td>
</tr>
</tbody>
</table>
<ul>
<li>Instrument verbs rather than gates, and each call appends exactly one node.</li>
<li>Durations are nanoseconds, frequencies hertz, phases radians, gain and offset dimensionless.</li>
<li>Which properties a machine can change, and when, is the machine's to declare. Part 3 reads that declaration.</li>
<li><code>measure</code> and <code>get_parameter</code> hand something back, and the other ten return <code>None</code>.</li>
</ul>
<footer>Pulse-level Programming with QProgram · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-footer="Pulse-level Programming with QProgram · QCE 2026" lang="en-US" data-marpit-pagination="44" style="--paginate:true;--footer:Pulse-level Programming with QProgram · QCE 2026;" data-marpit-pagination-total="81" data-size="16:9">
<h2 id="one-clock-per-bus">One clock per bus</h2>
<p><img src="img/timing.svg" alt="" style="height:350px;" /></p>
<ul>
<li>Every bus keeps its own cursor, advanced only by what you write to that bus.</li>
<li>A barrier holds every named bus until the furthest ahead has finished.</li>
<li>A bare <code>sync()</code> covers every bus in the program rather than the two you had in mind.</li>
<li>An empty list raises rather than guessing what you meant.</li>
</ul>
<footer>Pulse-level Programming with QProgram · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-footer="Pulse-level Programming with QProgram · QCE 2026" lang="en-US" data-marpit-pagination="45" style="--paginate:true;--footer:Pulse-level Programming with QProgram · QCE 2026;" data-marpit-pagination-total="81" data-size="16:9">
<h2 id="what-a-measurement-returns">What a measurement returns</h2>
<ul>
<li><code>measure</code> plays the readout tone and integrates what comes back, in one call.</li>
<li>The second waveform is the integration window, and a flat window of ones is the default here.</li>
<li>The reduction is a choice you make in the program: the ADC trace, the integrated point, the classified bit, or all three.</li>
<li>Ask for a field you never requested and it is a <code>KeyError</code>.</li>
<li>A handle is a name, so a result is indexed by what you called the measurement.</li>
</ul>
<footer>Pulse-level Programming with QProgram · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-footer="Pulse-level Programming with QProgram · QCE 2026" lang="en-US" data-marpit-pagination="46" style="--paginate:true;--footer:Pulse-level Programming with QProgram · QCE 2026;" data-marpit-pagination-total="81" data-size="16:9">
<h2 id="a-schema-not-a-string">A schema, not a string</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">program.measure(q[<span class="hljs-number">0</span>].drive, <span class="hljs-string">&quot;readout&quot;</span>, <span class="hljs-string">&quot;weights&quot;</span>)
-&gt; Bus <span class="hljs-string">&#x27;q0/drive&#x27;</span> does <span class="hljs-keyword">not</span> support acquisition (acquires=<span class="hljs-literal">False</span>).
</code></pre>
<ul>
<li>A raw string bus name builds, prints and saves, and nothing checks it until the run.</li>
<li>A <code>BusSchema</code> hands back a reference that is still a string and carries two facts about copper.</li>
<li>Which shape the line takes, real-valued or two-path, and whether an ADC listens to it.</li>
<li>Both become an error on the line that made the mistake, and raw strings skip both on purpose.</li>
</ul>
<footer>Pulse-level Programming with QProgram · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-footer="Pulse-level Programming with QProgram · QCE 2026" lang="en-US" data-marpit-pagination="47" style="--paginate:true;--footer:Pulse-level Programming with QProgram · QCE 2026;" data-marpit-pagination-total="81" data-size="16:9">
<h2 id="waveforms-are-data">Waveforms are data</h2>
<ul>
<li>A waveform describes one envelope and knows nothing about hardware.</li>
<li>Equality is structural, so two <code>Gaussian(0.5, 40, 8)</code> built in different cells are one waveform.</li>
<li>A program can then report how many distinct envelopes it plays.</li>
<li>Nothing in a shape names a line, so the bus decides whether a <code>Square</code> is a readout tone or a flux excursion.</li>
</ul>
<footer>Pulse-level Programming with QProgram · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-footer="Pulse-level Programming with QProgram · QCE 2026" lang="en-US" data-marpit-pagination="48" style="--paginate:true;--footer:Pulse-level Programming with QProgram · QCE 2026;" data-marpit-pagination-total="81" data-size="16:9">
<h2 id="a-file-you-can-diff">A file you can diff</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-diff"><span class="hljs-deletion">-    play &quot;q0/drive&quot; IQDrag(amplitude=0.62, duration=40, sigma=10, beta=0.15)</span>
<span class="hljs-addition">+    play &quot;q0/drive&quot; IQDrag(amplitude=0.31, duration=40, sigma=10, beta=0.15)</span>
</code></pre>
<ul>
<li>One statement per line, so a retune shows up as one changed line under version control.</li>
<li>Nothing truncated, nothing implied, and no dependency on a numpy version or a database.</li>
<li>The amplitudes that go stale live in a waveform library beside the program, resolved per bus.</li>
<li><code>rebind</code> re-spells every bus through another schema, so a second rack needs no find and replace.</li>
</ul>
<footer>Pulse-level Programming with QProgram · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-footer="Pulse-level Programming with QProgram · QCE 2026" lang="en-US" data-marpit-pagination="49" style="--paginate:true;--footer:Pulse-level Programming with QProgram · QCE 2026;" data-marpit-pagination-total="81" data-size="16:9">
<h2 id="the-simulator">The simulator</h2>
<ul>
<li><code>qp.simulate(program, model=...)</code> walks the tree in pure Python.</li>
<li>It models the shape of the experiment: the nesting, the repetition, one record per <code>measure</code>.</li>
<li>It models no timing and no waveform physics, so <code>wait</code> changes no number.</li>
<li>The program you write and the analysis you run on the results are the same ones a rack would run, and that is where the work lives.</li>
</ul>
<footer>Pulse-level Programming with QProgram · QCE 2026</footer>
</section>

<h2 id="a-program-with-holes">A program with holes</h2>
<ul>
<li>A program with no holes can only be run once, and the fab does not deliver the frequency you asked for.</li>
<li>A variable is the hole, and a sweep fills it once per iteration.</li>
<li>Arithmetic on one builds an expression and computes nothing, so a hole can sit inside a pulse envelope.</li>
<li>The label and units you declare name the axes of every figure drawn from the result.</li>

<h2 id="anatomy-of-a-program">Anatomy of a program</h2>
<p><img src="img/anatomy.svg" alt="" style="height:470px;" /></p>
<p class="cap"><code>sweep</code> creates an axis, <code>average</code> creates none, <code>measure</code> creates a record, and <code>play</code> carries the variable down.</p>

<h2 id="a-source-not-a-list">A source, not a list</h2>
<table>
<thead>
<tr>
<th><code>KIND</code></th>
<th>what it promises</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>linear</code></td>
<td>point <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>i</mi></mrow><annotation encoding="application/x-tex">i</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6595em;"></span><span class="mord mathnormal">i</span></span></span></span> is exactly <code>start + step * i</code></td>
</tr>
<tr>
<td><code>arbitrary</code></td>
<td>every other source, and its points have to be shipped</td>
</tr>
</tbody>
</table>
<ul>
<li>A bare list is refused, because a source declares its kind before the run starts and a list declares none.</li>
<li>A source also reports its length without running, which is how a lockstep pair is checked and how the result arrays are sized.</li>
<li><code>qp.Values</code> is arbitrary even when the numbers are evenly spaced, because a list proves nothing about itself.</li>
<li>Eight ship, and three of them take a source and hand back one, so they compose.</li>
</ul>
<footer>Pulse-level Programming with QProgram · QCE 2026</footer>

<h2 id="the-measurement-model">The measurement model</h2>
<ul>
<li>The interpreter asks a measurement model for one sample per shot, and every measured number in a run comes from it.</li>
<li>Every figure in the notebook therefore comes out of five constants and three short formulas you can read.</li>
<li><code>env</code> holds every variable a loop currently binds, keyed by the id you declared.</li>
<li>Any object with a <code>sample(bus, env)</code> method does the job, so a model may carry state.</li>
</ul>

<h2 id="the-grid-bounds-the-answer">The grid bounds the answer</h2>
<ul>
<li>A 20 MHz window in 200 kHz steps puts about seven samples across a 1.5 MHz resonance.</li>
<li>An argmin can never beat the step size, so that grid locates the resonator to 200 kHz.</li>
<li>A finer answer costs either a finer grid or a fit to the shape of the curve.</li>
</ul>

<li>The qubit answers only through the resonator, so finding it takes a second tone swept past <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>f</mi><mn>01</mn></msub></mrow><annotation encoding="application/x-tex">f_{01}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1076em;">f</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.1076em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">01</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span>.</li>
<li>A strong continuous drive balances excitation against decay, so the population saturates at one half.</li>
<li>A two-tone peak above that ceiling means the classifier is wrong.</li>
<li>The same formula sets the width, so a stronger drive broadens the line while the peak stays at one half.</li>
</ul>

<h2 id="a-rectangle-or-a-diagonal">A rectangle or a diagonal</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">with</span> program.sweep(amp, ...):                          <span class="hljs-comment"># a rectangle</span>
    <span class="hljs-keyword">with</span> program.sweep(freq, ...):
        ...
<span class="hljs-keyword">with</span> program.sweep(amp, ...) | program.sweep(freq, ...):   <span class="hljs-comment"># a diagonal</span>
    ...
</code></pre>
<ul>
<li>Nested <code>with</code> statements are nested loops, so a two-deep nest is a rectangle of points.</li>
<li><code>|</code> advances both on the same tick instead, and one dimension comes back carrying two coordinates.</li>
<li>The map cost 861 points at 200 shots, and most of them sat off resonance.</li>
<li>Walking the ridge is 21 points over the same body, once the map has found it.</li>
</ul>

<h1 id="fragments-feedback-and-the-machine">Fragments, feedback, and the machine</h1>
<h3 id="two-seams-for-writing-less-two-for-vocabulary-the-core-must-never-ship-and-two-for-the-machine-that-runs-it">Two seams for writing less, two for vocabulary the core must never ship, and two for the machine that runs it</h3>
<footer>Pulse-level Programming with QProgram · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-footer="Pulse-level Programming with QProgram · QCE 2026" lang="en-US" data-marpit-pagination="62" style="--paginate:true;--footer:Pulse-level Programming with QProgram · QCE 2026;" data-marpit-pagination-total="81" data-size="16:9">
<h2 id="one-definition-many-call-sites">One definition, many call sites</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">fragment x_pulse(drive, amp):
  play drive IQDrag(amplitude=amp, duration=40, sigma=10, beta=0.1)

body:
  x_pulse(&quot;q0/drive&quot;, 0.5)
  x_pulse(&quot;q0/drive&quot;, 0.25)
</code></pre>
<ul>
<li><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>T</mi><mn>1</mn></msub></mrow><annotation encoding="application/x-tex">T_1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">1</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span>, Ramsey and echo are prepare, wait, read out, and only the middle changes.</li>
<li>Three copies of the pulse definition drift apart at the next recalibration, and the three curves stop being comparable.</li>
<li>A <code>@fragment</code> is one named, parameterized definition, and each call site stays one line in the file.</li>
<li><code>expand()</code> inlines every call, so keep <code>measure</code> in the program where the handle stays yours.</li>
</ul>
<footer>Pulse-level Programming with QProgram · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-footer="Pulse-level Programming with QProgram · QCE 2026" lang="en-US" data-marpit-pagination="63" style="--paginate:true;--footer:Pulse-level Programming with QProgram · QCE 2026;" data-marpit-pagination-total="81" data-size="16:9">
<h2 id="a-branch-inside-the-shot">A branch inside the shot</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>excited before: 0.305
excited after:  0.029
</code></pre>
<ul>
<li>A branch inside the shot cannot be faked by a host round trip, because the decision has to land before the qubit relaxes.</li>
<li>The condition is one comparison of one classified state against an integer, and nothing wider.</li>
<li>Passive reset idles several <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>T</mi><mn>1</mn></msub></mrow><annotation encoding="application/x-tex">T_1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">1</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span> before every shot. Active reset measures first and flips only the shots that came back excited.</li>
<li>One extra measurement and one conditional pulse take 30 percent hot down to 3.</li>
</ul>
<footer>Pulse-level Programming with QProgram · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-paginate="true" data-footer="Pulse-level Programming with QProgram · QCE 2026" lang="en-US" data-marpit-pagination="64" style="--paginate:true;--footer:Pulse-level Programming with QProgram · QCE 2026;" data-marpit-pagination-total="81" data-size="16:9">
<h2 id="three-extension-seams">Three extension seams</h2>
<table>
<thead>
<tr>
<th>you want</th>
<th>you write</th>
<th>you get for free</th>
</tr>
</thead>
<tbody>
<tr>
<td>a pulse shape the DSL lacks</td>
<td>a <code>Waveform</code> subclass</td>
<td>serialization, structural equality, validation, plotting</td>
</tr>
<tr>
<td>a sweep axis the DSL lacks</td>
<td>a <code>SweepSource</code> subclass</td>
<td>serialization, a capability token, length checks, coordinates</td>
</tr>
<tr>
<td>an operation the DSL will never have</td>
<td>an <code>Operation</code> plus a <code>VendorNamespace</code></td>
<td><code>program.&lt;vendor&gt;.&lt;op&gt;()</code>, a <code>require</code> line, a capability token</td>
</tr>
</tbody>
</table>
<ul>
<li>A language that cannot be extended gets forked, and a fork stops being portable.</li>
<li>A capability token is a dotted name a rack can refuse the node by.</li>
<li>The extension travels inside the file, so a colleague loads it without knowing what to import.</li>
<li>A swept parameter arrives as a <code>qp.Expression</code>, so a shape that does not resolve it fails inside numpy naming neither the waveform nor the variable.</li>
</ul>
<footer>Pulse-level Programming with QProgram · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-paginate="true" data-footer="Pulse-level Programming with QProgram · QCE 2026" lang="en-US" data-marpit-pagination="65" style="--paginate:true;--footer:Pulse-level Programming with QProgram · QCE 2026;" data-marpit-pagination-total="81" data-size="16:9">
<h2 id="one-portable-file">One portable file</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">#!QProgram 0.2

require twpa 0.1

body:
  var flux_amp label=&quot;Flux amplitude&quot; units=&quot;DAC units&quot;

  twpa.set_pump &quot;q0/readout&quot; 7900000000.0
  average 200:
    for flux_amp in Chebyshev(start=0.0, stop=0.5, num=21):
      play &quot;q0/flux&quot; HalfSine(amplitude=flux_amp, duration=40)
      sync &quot;q0/flux&quot; &quot;q0/readout&quot;
      measure &quot;q0/readout&quot; &quot;readout&quot; &quot;weights&quot; name=&quot;m0&quot; fields=[&quot;state&quot;]
</code></pre>
<ul>
<li>The <code>require</code> header names each vendor, and the loader imports what it names.</li>
<li>Only the <code>qprogram.vendors</code> entry-point group is scanned.</li>
<li>A vendor nobody claims fails by name, naming the package to install.</li>
<li>So an archived file still loads years later, in an interpreter that imported nothing.</li>
</ul>
<footer>Pulse-level Programming with QProgram · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-paginate="true" data-footer="Pulse-level Programming with QProgram · QCE 2026" lang="en-US" data-marpit-pagination="66" style="--paginate:true;--footer:Pulse-level Programming with QProgram · QCE 2026;" data-marpit-pagination-total="81" data-size="16:9">
<h2 id="two-vendors-one-name">Two vendors, one name</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">op.set_offset            qblox True  qdac False
vendor.qdac.set_offset   qblox False qdac True
</code></pre>
<ul>
<li>Every operation sets or reads a property of a bus, and a profile is where a machine says which properties it has.</li>
<li>A Qblox bus changes its offset between one pulse and the next, so <code>qblox-default-v1</code> claims the core <code>op.set_offset</code>.</li>
<li>A QDAC channel takes every change through the host at millisecond latency, so <code>qdac-default-v1</code> refuses that name and offers its own.</li>
<li>Borrowing a core name whose meaning does not fit would make the two look interchangeable.</li>
</ul>
<footer>Pulse-level Programming with QProgram · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="67" data-paginate="true" data-footer="Pulse-level Programming with QProgram · QCE 2026" lang="en-US" data-marpit-pagination="67" style="--paginate:true;--footer:Pulse-level Programming with QProgram · QCE 2026;" data-marpit-pagination-total="81" data-size="16:9">
<h2 id="what-a-platform-supplies">What a platform supplies</h2>
<ul>
<li>Six questions: the chip it is wired to, the buses it exposes, the knobs per bus and platform wide, what it can run, and <code>execute</code>.</li>
<li>Only the last one is work. <code>validate</code>, <code>plan</code> and <code>explain</code> arrive already written off the descriptor.</li>
<li>Between <code>execute</code> and the arrays the protocol says nothing at all. Compile, upload, run, assemble.</li>
<li>That work is where a vendor's expertise lives, and it is deliberately outside the interface.</li>
</ul>
<footer>Pulse-level Programming with QProgram · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="68" data-paginate="true" data-footer="Pulse-level Programming with QProgram · QCE 2026" lang="en-US" data-marpit-pagination="68" style="--paginate:true;--footer:Pulse-level Programming with QProgram · QCE 2026;" data-marpit-pagination-total="81" data-size="16:9">
<h2 id="two-racks">Two racks</h2>
<table>
<thead>
<tr>
<th></th>
<th>rack A, yours</th>
<th>rack B, next door</th>
</tr>
</thead>
<tbody>
<tr>
<td>drive and readout</td>
<td>one box, one shared clock</td>
<td>one box, one shared clock</td>
</tr>
<tr>
<td>flux line</td>
<td>a DC-coupled output on that box</td>
<td>a 20-bit DC source over Ethernet</td>
</tr>
<tr>
<td>bus names</td>
<td><code>q0/drive</code></td>
<td><code>drive_q0</code></td>
</tr>
</tbody>
</table>
<ul>
<li>The flux row is the one that changes how the program runs.</li>
<li>Heavy filtering keeps a flux line quiet and gives it millisecond time constants, so nothing behind it steps a loop.</li>
<li>Your program named neither rack, neither wiring choice, and neither calibration.</li>
<li>The same file is the deliverable in both labs, and <code>rebind</code> settles the naming.</li>
</ul>
<footer>Pulse-level Programming with QProgram · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="69" data-paginate="true" data-footer="Pulse-level Programming with QProgram · QCE 2026" lang="en-US" data-marpit-pagination="69" style="--paginate:true;--footer:Pulse-level Programming with QProgram · QCE 2026;" data-marpit-pagination-total="81" data-size="16:9">
<h2 id="two-loops-one-file">Two loops, one file</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">  average 200:
    for bias in Linspace(start=-0.05, stop=0.15, num=41):
      set_offset q[0].flux bias
      set_frequency q[0].drive 4850000000.0
      play q[0].drive &quot;pi&quot;
      sync q[0].drive q[0].readout
      measure q[0].readout &quot;probe&quot; &quot;weights&quot; name=&quot;m0&quot; fields=[&quot;state&quot;]
</code></pre>
<ul>
<li>The outer loop steps a DC level onto a slow, filtered line, milliseconds per step.</li>
<li>Everything inside it retunes a source, fires a pulse and reads out, microseconds per step.</li>
<li>The file never recorded which of the two is which, and it should not have.</li>
<li>The rest of this part is how a rack settles it, and what that costs when it settles it badly.</li>
</ul>
<footer>Pulse-level Programming with QProgram · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="70" data-paginate="true" data-footer="Pulse-level Programming with QProgram · QCE 2026" lang="en-US" data-marpit-pagination="70" style="--paginate:true;--footer:Pulse-level Programming with QProgram · QCE 2026;" data-marpit-pagination-total="81" data-size="16:9">
<h2 id="the-cost-of-a-loop">The cost of a loop</h2>
<table>
<thead>
<tr>
<th>where the loop runs</th>
<th>one execution</th>
<th>41 points, 200 shots</th>
</tr>
</thead>
<tbody>
<tr>
<td>real time, passive reset</td>
<td>2 us readout plus <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>5</mn><msub><mi>T</mi><mn>1</mn></msub></mrow><annotation encoding="application/x-tex">5T_1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord">5</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">1</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span></td>
<td><strong>0.75 s</strong></td>
</tr>
<tr>
<td>real time, active reset</td>
<td>about 10 us</td>
<td><strong>0.08 s</strong></td>
</tr>
<tr>
<td>host, one round trip per execution</td>
<td>about 1 ms</td>
<td><strong>8.2 s</strong></td>
</tr>
</tbody>
</table>
<ul>
<li><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>T</mi><mn>1</mn></msub></mrow><annotation encoding="application/x-tex">T_1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">1</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span> is 18 us on this chip, so passive reset spends 90 of those 92 microseconds waiting.</li>
<li>A host round trip costs three orders of magnitude more than a real-time one.</li>
<li>Which one you get is a property of the rack, and the rest of this part makes it visible.</li>
</ul>
<footer>Pulse-level Programming with QProgram · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="71" data-paginate="true" data-footer="Pulse-level Programming with QProgram · QCE 2026" lang="en-US" data-marpit-pagination="71" style="--paginate:true;--footer:Pulse-level Programming with QProgram · QCE 2026;" data-marpit-pagination-total="81" data-size="16:9">
<h2 id="rt-and-host">rt and host</h2>
<ul>
<li>Every capability slot splits into an <code>rt</code> half and a <code>host</code> half, the two <strong>domains</strong> a node can run in.</li>
<li><code>rt</code> runs inside the instrument, and <code>host</code> is dispatched from the control PC.</li>
<li>Either half may be <code>None</code>, and a <code>None</code> is a statement about the wiring.</li>
<li>A slot is keyed by kind of bus, so <code>(&quot;q&quot;, &quot;flux&quot;)</code> is separate from <code>(&quot;q&quot;, &quot;drive&quot;)</code> and describes a class of rack rather than one wiring list.</li>
</ul>
<footer>Pulse-level Programming with QProgram · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="72" data-paginate="true" data-footer="Pulse-level Programming with QProgram · QCE 2026" lang="en-US" data-marpit-pagination="72" style="--paginate:true;--footer:Pulse-level Programming with QProgram · QCE 2026;" data-marpit-pagination-total="81" data-size="16:9">
<h2 id="tokens-limits-predicates">Tokens, limits, predicates</h2>
<table>
<thead>
<tr>
<th>mechanism</th>
<th>the question it answers</th>
<th>examples</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>token</strong></td>
<td>is this in the set?</td>
<td><code>op.play</code>, <code>waveform.iq_drag</code>, <code>sweep.logspace</code></td>
</tr>
<tr>
<td><strong>limit</strong></td>
<td>is this number small enough?</td>
<td><code>max_loop_nesting</code>, <code>max_measurements</code></td>
</tr>
<tr>
<td><strong>predicate</strong></td>
<td>given the rest of the program, is this legal?</td>
<td>no arbitrary sweep at <code>Wait.duration</code></td>
</tr>
</tbody>
</table>
<ul>
<li>Every node answers <code>required_capabilities()</code> with a set of dotted strings computed from its own data.</li>
<li>Supply is a set the rack publishes, so checking one is a hash lookup and no instrument is attached.</li>
<li>The validator reads four numeric limits and passes over every other key a profile publishes.</li>
<li>A token set is small enough for a vendor to ship as a named, versioned profile.</li>
</ul>
<footer>Pulse-level Programming with QProgram · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="73" data-paginate="true" data-footer="Pulse-level Programming with QProgram · QCE 2026" lang="en-US" data-marpit-pagination="73" style="--paginate:true;--footer:Pulse-level Programming with QProgram · QCE 2026;" data-marpit-pagination-total="81" data-size="16:9">
<h2 id="reading-the-plan">Reading the plan</h2>
<table>
<thead>
<tr>
<th>label</th>
<th>what it means</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>[rt]</code></td>
<td>real time, inside the instrument</td>
</tr>
<tr>
<td><code>[host]</code></td>
<td>dispatched from the control PC, one round trip per iteration</td>
</tr>
<tr>
<td><code>[rt|host]</code></td>
<td>either one, and the platform picks</td>
</tr>
<tr>
<td><code>[--]</code></td>
<td>nothing can run it, and an error above says why</td>
</tr>
</tbody>
</table>
<ul>
<li>The plan is the second half of what <code>qp.validate</code> returns.</li>
<li>Read it from the leaves up, because an operation that can run nowhere empties the loop holding it.</li>
<li>So the loop's own line carries no reason, and an empty child propagates exactly one level.</li>
<li><code>qp.explain</code> draws the same plan as a tree, marking each diagnostic inline, <code>!!</code> error, <code>~</code> warning, <code>i</code> info.</li>
</ul>
<footer>Pulse-level Programming with QProgram · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="74" data-paginate="true" data-footer="Pulse-level Programming with QProgram · QCE 2026" lang="en-US" data-marpit-pagination="74" style="--paginate:true;--footer:Pulse-level Programming with QProgram · QCE 2026;" data-marpit-pagination-total="81" data-size="16:9">
<h2 id="two-domains">Two domains</h2>
<p><img src="img/plan.svg" alt="" style="height:460px;" /></p>
<p class="cap">Drive and readout run in real time, flux on a slow DAC, so the bias loop runs host side and drags the averaging with it.</p>
<footer>Pulse-level Programming with QProgram · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="75" data-paginate="true" data-footer="Pulse-level Programming with QProgram · QCE 2026" lang="en-US" data-marpit-pagination="75" style="--paginate:true;--footer:Pulse-level Programming with QProgram · QCE 2026;" data-marpit-pagination-total="81" data-size="16:9">
<h2 id="the-rewrite-is-opt-in">The rewrite is opt-in</h2>
<ul>
<li>A block runs where its worst child runs, so the averaging fell to the host and pays the round trip 200 times per point.</li>
<li><code>qp.optimize(program, caps)</code> swaps the two loops and hoists the bias write between them.</li>
<li>It is not unconditionally equivalent. It takes all 200 shots of one point before moving on, where the program as written interleaved passes over the whole sweep.</li>
<li>The same experiment for a stationary device, a different one under drift, so the call stays yours.</li>
</ul>
<footer>Pulse-level Programming with QProgram · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="76" data-paginate="true" data-footer="Pulse-level Programming with QProgram · QCE 2026" lang="en-US" data-marpit-pagination="76" style="--paginate:true;--footer:Pulse-level Programming with QProgram · QCE 2026;" data-marpit-pagination-total="81" data-size="16:9">
<h2 id="one-bare-sync">One bare sync</h2>
<ul>
<li>A bare <code>sync()</code> pulls every bus into one domain intersection.</li>
<li>The flux bus has no real-time half, so that sync lands host side in the middle of a run of real-time operations.</li>
<li>Nothing can be hoisted across it, and the rewrite is lost with no error message.</li>
<li>Naming the two buses you mean keeps the sync real time and the rewrite alive.</li>
</ul>
<footer>Pulse-level Programming with QProgram · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="77" data-paginate="true" data-footer="Pulse-level Programming with QProgram · QCE 2026" lang="en-US" data-marpit-pagination="77" style="--paginate:true;--footer:Pulse-level Programming with QProgram · QCE 2026;" data-marpit-pagination-total="81" data-size="16:9">
<h2 id="a-rule-about-your-own-wiring">A rule about your own wiring</h2>
<ul>
<li>A predicate is code, and it is where a lab writes down a fact about its own wiring that no vendor profile carries.</li>
<li>This rack's flux DAC will not go past a tenth of a volt, and that number lives in a predicate.</li>
<li>The validation context is what makes the rule expressible, because the values live in the loop that binds the variable.</li>
<li>It yields a <code>Diagnostic</code> to refuse, or a <code>DomainConstraint</code> that moves a loop host side rather than failing the program.</li>
</ul>
<footer>Pulse-level Programming with QProgram · QCE 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="78" data-paginate="true" data-footer="Pulse-level Programming with QProgram · QCE 2026" lang="en-US" data-marpit-pagination="78" style="--paginate:true;--footer:Pulse-level Programming with QProgram · QCE 2026;" data-marpit-pagination-total="81" data-size="16:9">
<h2 id="diagnostics-as-data">Diagnostics as data</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>$ python -m qprogram.lsp check flux_sweep.qp   (exit 1)
[{&quot;line&quot;: 18, &quot;end_line&quot;: 18, &quot;severity&quot;: &quot;error&quot;, &quot;code&quot;: &quot;parse-error&quot;,
  &quot;message&quot;: &quot;Line 19: bus path 'q[0].drve' does not resolve against the
  program schema: 'q' has no bus 'drve'. Available: drive, readout, flux&quot;}]
</code></pre>
<ul>
<li><code>qp.validate</code> returns diagnostics and raises nothing, so one call serves three callers with different needs.</li>
<li>An editor that wants every problem, a build that wants a non-zero exit, a notebook that wants to keep going.</li>
<li><code>execute</code> is the caller that turns an error into an exception, so nothing broken reaches a rack.</li>
<li>The editor and the parser cannot drift apart, because both are this one module.</li>
</ul>
<footer>Pulse-level Programming with QProgram · QCE 2026</footer>
</section>

<h2 id="exercise-31">Exercise 3.1</h2>
<blockquote>
<p><img class="emoji" draggable="false" alt="🧩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9e9.svg" data-marp-twemoji=""/> Add a vendor measurement field, then prove it is legal on one rack and refused on another.</p>
</blockquote>
<ul>
<li>One token registration widens <code>measure</code> itself, because the <code>fields=</code> vocabulary is read off the capability registry.</li>
<li>The token makes the field legal and the executor allocates the array for it.</li>
<li>Nothing in the reference platform knows how to produce a photon count, so the counts come back zero.</li>
</ul>
