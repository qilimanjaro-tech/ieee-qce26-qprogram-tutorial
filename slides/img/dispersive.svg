<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" width="1600" height="760"
     role="img" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>How a measurement becomes a number</title>
  <desc>Four panels. A qubit and the resonator beside it, coupled at rate g, so the resonator sits
  at fr minus chi or fr plus chi and the qubit state picks which. Two transmission dips on one
  frequency axis, 2 chi = 3.6 MHz apart and kappa = 1.5 MHz wide, with the readout tone parked on
  the dip the ground state gives. The chain after the chip: returning tone, amplifier chain, IF
  mixer, ADC, demodulation, one complex number per shot. The IQ plane, where the two clouds sit a
  distance d apart, each spread by sigma, with a threshold drawn between them.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10.5" refY="6"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrowback" viewBox="0 0 12 12" refX="1.5" refY="6"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M11 1 L1 6 L11 11 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrowgrey" viewBox="0 0 12 12" refX="10.5" refY="6"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#6a6a82"/>
    </marker>
  </defs>

  <rect width="1600" height="760" fill="#ffffff"/>

  <text x="40" y="52" font-size="32" font-weight="700" fill="#1c1c2e">How a measurement becomes a number</text>

  <!-- ============ 1: the coupled pair ============ -->
  <rect x="40" y="88" width="320" height="636" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="66" y="132" font-size="25" font-weight="700" fill="#1c1c2e">The coupled pair</text>

  <rect x="66" y="170" width="268" height="100" rx="10" fill="#f5f5fa" stroke="#0f766e" stroke-width="2"/>
  <text x="200" y="212" font-size="26" font-weight="700" fill="#1c1c2e" text-anchor="middle">q0</text>
  <text x="200" y="246" font-size="22" fill="#6a6a82" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">f01 = 4.85 GHz</text>

  <line x1="200" y1="270" x2="200" y2="360" stroke="#0f766e" stroke-width="2"/>
  <text x="212" y="322" font-size="26" font-weight="700" fill="#0f766e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">g</text>
  <text x="236" y="322" font-size="22" fill="#6a6a82">coupling</text>

  <rect x="66" y="360" width="268" height="100" rx="10" fill="#f5f5fa" stroke="#0f766e" stroke-width="2"/>
  <text x="200" y="402" font-size="26" font-weight="700" fill="#1c1c2e" text-anchor="middle">resonator</text>
  <text x="200" y="436" font-size="22" fill="#6a6a82" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">fr = 7.20 GHz</text>

  <line x1="200" y1="460" x2="200" y2="524" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="66" y="534" width="268" height="154" rx="10" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
  <text x="200" y="596" font-size="24" fill="#1c1c2e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">|0&gt;  -&gt;  fr - chi</text>
  <text x="200" y="644" font-size="24" fill="#1c1c2e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">|1&gt;  -&gt;  fr + chi</text>

  <polygon points="364,394 384,406 364,418" fill="#0f766e"/>

  <!-- ============ 2: two dips on one frequency axis ============ -->
  <rect x="388" y="88" width="400" height="636" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="414" y="132" font-size="25" font-weight="700" fill="#1c1c2e">Two dips, one axis</text>

  <!-- the split, measured minimum to minimum -->
  <text x="588" y="182" font-size="22" fill="#0b5c56" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">2 chi = 3.6 MHz</text>
  <line x1="508" y1="200" x2="668" y2="200" stroke="#0f766e" stroke-width="2"
        marker-start="url(#arrowback)" marker-end="url(#arrow)"/>

  <!-- the resonator with the qubit in |1>, dipping at fr + chi (chi is negative) -->
  <polyline fill="none" stroke="#6a6a82" stroke-width="2.5" stroke-dasharray="7 6" points="
            412,246.9 416,248.9 420,251.1 424,253.6 428,256.3 432,259.4 436,263.0 440,267.0
            444,271.6 448,276.8 452,282.8 456,289.8 460,297.7 464,307.0 468,317.6 472,329.8
            476,343.6 480,359.2 484,376.4 488,394.6 492,413.1 496,430.4 500,444.9 504,454.6
            508,458.0 512,454.6 516,444.9 520,430.4 524,413.1 528,394.6 532,376.4 536,359.2
            540,343.6 544,329.8 548,317.6 552,307.0 556,297.7 560,289.8 564,282.8 568,276.8
            572,271.6 576,267.0 580,263.0 584,259.4 588,256.3 592,253.6 596,251.1 600,248.9
            604,246.9 608,245.2 612,243.6 616,242.2 620,240.9 624,239.7 628,238.6 632,237.6
            636,236.7 640,235.9 644,235.1 648,234.4 652,233.8 656,233.2 660,232.6 664,232.1
            668,231.6 672,231.2 676,230.8 680,230.4 684,230.0 688,229.7 692,229.4 696,229.1
            700,228.8 704,228.5 708,228.3 712,228.0 716,227.8 720,227.6 724,227.4 728,227.2
            732,227.0 736,226.8 740,226.7 744,226.5 748,226.4 752,226.2 756,226.1 760,226.0
            764,225.9"/>

  <!-- the resonator with the qubit in |0>, dipping at fr - chi (chi is negative) -->
  <polyline fill="none" stroke="#0f766e" stroke-width="2.5" points="
            412,225.9 416,226.0 420,226.1 424,226.2 428,226.4 432,226.5 436,226.7 440,226.8
            444,227.0 448,227.2 452,227.4 456,227.6 460,227.8 464,228.0 468,228.3 472,228.5
            476,228.8 480,229.1 484,229.4 488,229.7 492,230.0 496,230.4 500,230.8 504,231.2
            508,231.6 512,232.1 516,232.6 520,233.2 524,233.8 528,234.4 532,235.1 536,235.9
            540,236.7 544,237.6 548,238.6 552,239.7 556,240.9 560,242.2 564,243.6 568,245.2
            572,246.9 576,248.9 580,251.1 584,253.6 588,256.3 592,259.4 596,263.0 600,267.0
            604,271.6 608,276.8 612,282.8 616,289.8 620,297.7 624,307.0 628,317.6 632,329.8
            636,343.6 640,359.2 644,376.4 648,394.6 652,413.1 656,430.4 660,444.9 664,454.6
            668,458.0 672,454.6 676,444.9 680,430.4 684,413.1 688,394.6 692,376.4 696,359.2
            700,343.6 704,329.8 708,317.6 712,307.0 716,297.7 720,289.8 724,282.8 728,276.8
            732,271.6 736,267.0 740,263.0 744,259.4 748,256.3 752,253.6 756,251.1 760,248.9
            764,246.9"/>

  <!-- the linewidth, measured across one dip at half depth -->
  <text x="508" y="314" font-size="22" fill="#0b5c56" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">kappa</text>
  <line x1="475" y1="340" x2="541" y2="340" stroke="#0f766e" stroke-width="2"
        marker-start="url(#arrowback)" marker-end="url(#arrow)"/>

  <!-- the frequency axis -->
  <line x1="412" y1="578" x2="770" y2="578" stroke="#6a6a82" stroke-width="2" marker-end="url(#arrowgrey)"/>
  <line x1="588" y1="578" x2="588" y2="590" stroke="#6a6a82" stroke-width="2"/>
  <text x="588" y="622" font-size="22" fill="#6a6a82" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">fr = 7.20 GHz</text>

  <!-- which dip belongs to which state -->
  <text x="508" y="506" font-size="24" font-weight="700" fill="#6a6a82" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">|1&gt;</text>
  <text x="692" y="506" font-size="24" font-weight="700" fill="#0f766e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">|0&gt;</text>

  <!-- the tone, parked down the dip the ground state gives -->
  <line x1="668" y1="208" x2="668" y2="596" stroke="#1c1c2e" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="654" y="548" font-size="20" fill="#1c1c2e" text-anchor="end">readout tone</text>

  <text x="588" y="688" font-size="24" fill="#0b5c56" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">kappa = 1.5 MHz</text>

  <polygon points="792,394 812,406 792,418" fill="#0f766e"/>

  <!-- ============ 3: the chain after the chip ============ -->
  <rect x="816" y="88" width="334" height="636" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="842" y="132" font-size="25" font-weight="700" fill="#1c1c2e">After the chip</text>

  <rect x="842" y="170" width="282" height="64" rx="10" fill="#f5f5fa" stroke="#6a6a82" stroke-width="2"/>
  <text x="983" y="210" font-size="24" font-weight="700" fill="#1c1c2e" text-anchor="middle">returning tone</text>
  <line x1="983" y1="234" x2="983" y2="254" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="842" y="254" width="282" height="64" rx="10" fill="#f5f5fa" stroke="#6a6a82" stroke-width="2"/>
  <text x="983" y="294" font-size="24" font-weight="700" fill="#1c1c2e" text-anchor="middle">amplifier chain</text>
  <line x1="983" y1="318" x2="983" y2="338" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="842" y="338" width="282" height="64" rx="10" fill="#f5f5fa" stroke="#6a6a82" stroke-width="2"/>
  <text x="983" y="378" font-size="24" font-weight="700" fill="#1c1c2e" text-anchor="middle">IF mixer</text>
  <line x1="983" y1="402" x2="983" y2="422" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="842" y="422" width="282" height="64" rx="10" fill="#f5f5fa" stroke="#6a6a82" stroke-width="2"/>
  <text x="983" y="462" font-size="24" font-weight="700" fill="#1c1c2e" text-anchor="middle">ADC</text>
  <line x1="983" y1="486" x2="983" y2="506" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="842" y="506" width="282" height="78" rx="10" fill="#f5f5fa" stroke="#6a6a82" stroke-width="2"/>
  <text x="983" y="540" font-size="24" font-weight="700" fill="#1c1c2e" text-anchor="middle">demodulate</text>
  <text x="983" y="568" font-size="20" fill="#6a6a82" text-anchor="middle">weighted integration</text>
  <line x1="983" y1="584" x2="983" y2="604" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="842" y="604" width="282" height="84" rx="10" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
  <text x="983" y="640" font-size="24" font-weight="700" fill="#1c1c2e" text-anchor="middle">one complex number</text>
  <text x="983" y="670" font-size="22" fill="#6a6a82" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">per shot</text>

  <polygon points="1154,394 1174,406 1154,418" fill="#0f766e"/>

  <!-- ============ 4: the IQ plane ============ -->
  <rect x="1178" y="88" width="382" height="636" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="1204" y="132" font-size="25" font-weight="700" fill="#1c1c2e">The IQ plane</text>

  <rect x="1204" y="160" width="330" height="540" rx="10" fill="#f5f5fa" stroke="#6a6a82" stroke-width="2"/>
  <line x1="1232" y1="656" x2="1520" y2="656" stroke="#6a6a82" stroke-width="2" marker-end="url(#arrowgrey)"/>
  <line x1="1232" y1="656" x2="1232" y2="186" stroke="#6a6a82" stroke-width="2" marker-end="url(#arrowgrey)"/>
  <text x="1516" y="684" font-size="22" fill="#6a6a82" text-anchor="end">I</text>
  <text x="1250" y="204" font-size="22" fill="#6a6a82">Q</text>

  <text x="1392" y="276" font-size="26" font-weight="700" fill="#0f766e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">d</text>
  <line x1="1318" y1="288" x2="1466" y2="288" stroke="#0f766e" stroke-width="2"
        marker-start="url(#arrowback)" marker-end="url(#arrow)"/>

  <!-- the threshold, drawn between the clouds -->
  <line x1="1392" y1="300" x2="1392" y2="630" stroke="#1c1c2e" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="1404" y="620" font-size="20" fill="#6a6a82">threshold</text>

  <text x="1318" y="332" font-size="24" font-weight="700" fill="#0f766e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">|0&gt;</text>
  <text x="1466" y="332" font-size="24" font-weight="700" fill="#1c1c2e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">|1&gt;</text>

  <!-- one shot per circle, placed deterministically -->
  <g fill="#0f766e">
    <circle cx="1324.1" cy="420.0" r="5"/><circle cx="1310.1" cy="427.2" r="5"/>
    <circle cx="1319.2" cy="406.0" r="5"/><circle cx="1328.2" cy="433.4" r="5"/>
    <circle cx="1298.9" cy="416.6" r="5"/><circle cx="1336.3" cy="408.4" r="5"/>
    <circle cx="1311.9" cy="443.0" r="5"/><circle cx="1306.0" cy="397.0" r="5"/>
    <circle cx="1344.3" cy="429.7" r="5"/><circle cx="1290.2" cy="431.5" r="5"/>
    <circle cx="1331.6" cy="390.8" r="5"/><circle cx="1328.2" cy="452.7" r="5"/>
    <circle cx="1286.5" cy="401.7" r="5"/><circle cx="1355.6" cy="411.7" r="5"/>
    <circle cx="1294.5" cy="453.4" r="5"/><circle cx="1312.4" cy="377.2" r="5"/>
    <circle cx="1353.0" cy="449.5" r="5"/><circle cx="1269.6" cy="422.0" r="5"/>
    <circle cx="1354.5" cy="383.7" r="5"/><circle cx="1315.4" cy="474.8" r="5"/>
    <circle cx="1280.2" cy="374.9" r="5"/><circle cx="1381.3" cy="428.5" r="5"/>
  </g>
  <g fill="#1c1c2e">
    <circle cx="1470.8" cy="424.0" r="5"/><circle cx="1455.2" cy="420.4" r="5"/>
    <circle cx="1476.0" cy="410.0" r="5"/><circle cx="1465.2" cy="436.8" r="5"/>
    <circle cx="1453.6" cy="405.1" r="5"/><circle cx="1487.4" cy="422.9" r="5"/>
    <circle cx="1446.4" cy="433.6" r="5"/><circle cx="1471.7" cy="394.6" r="5"/>
    <circle cx="1479.9" cy="444.3" r="5"/><circle cx="1437.4" cy="410.9" r="5"/>
    <circle cx="1495.2" cy="406.5" r="5"/><circle cx="1452.8" cy="451.6" r="5"/>
    <circle cx="1453.7" cy="385.8" r="5"/><circle cx="1500.1" cy="438.0" r="5"/>
    <circle cx="1426.5" cy="430.4" r="5"/><circle cx="1489.3" cy="383.6" r="5"/>
    <circle cx="1473.8" cy="465.1" r="5"/><circle cx="1427.7" cy="390.3" r="5"/>
    <circle cx="1517.3" cy="415.8" r="5"/><circle cx="1428.8" cy="460.4" r="5"/>
    <circle cx="1466.3" cy="361.1" r="5"/><circle cx="1508.8" cy="467.2" r="5"/>
  </g>

  <circle cx="1318" cy="420" r="30" fill="none" stroke="#1c1c2e" stroke-width="2" stroke-dasharray="7 5"/>
  <line x1="1318" y1="484" x2="1318" y2="508" stroke="#1c1c2e" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="1318" y="528" font-size="22" fill="#1c1c2e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">sigma</text>
</svg>
