<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 868" width="1600" height="868"
     role="img" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Anatomy of a Rabi program</title>
  <desc>The Rabi program as a tree: body holds an Average, which holds a Sweep, which holds the
  set_frequency, play, sync and measure operations. The Average adds no dimension to the result, the
  Sweep adds one, and the Measure adds one record. The band at the bottom shows the dimensions and
  the shape of the two arrays the run returns.</desc>

  <rect width="1600" height="868" fill="#ffffff"/>

  <text x="40" y="56" font-size="32" font-weight="700" fill="#1c1c2e">Anatomy of a Rabi program</text>

  <g transform="translate(0,-32)">

  <!-- tree connectors, drawn first so the boxes sit on top -->
  <path d="M60 204 V254 H100" fill="none" stroke="#6a6a82" stroke-width="2"/>
  <path d="M120 286 V336 H160" fill="none" stroke="#6a6a82" stroke-width="2"/>
  <path d="M180 368 V664" fill="none" stroke="#6a6a82" stroke-width="2"/>
  <path d="M180 418 H220" fill="none" stroke="#6a6a82" stroke-width="2"/>
  <path d="M180 500 H220" fill="none" stroke="#6a6a82" stroke-width="2"/>
  <path d="M180 582 H220" fill="none" stroke="#6a6a82" stroke-width="2"/>
  <path d="M180 664 H220" fill="none" stroke="#6a6a82" stroke-width="2"/>

  <!-- the tree, one row per node -->
  <g font-size="22" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="40" y="140" width="1100" height="64" rx="12" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
    <text x="60" y="181" fill="#1c1c2e">body</text>

    <rect x="100" y="222" width="1040" height="64" rx="12" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
    <text x="120" y="263" fill="#1c1c2e">average 200:</text>

    <rect x="160" y="304" width="980" height="64" rx="12" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
    <text x="180" y="345" fill="#1c1c2e">for amp in Linspace(0.0, 1.0, 41):</text>

    <rect x="220" y="386" width="920" height="64" rx="12" fill="#f5f5fa" stroke="#6a6a82" stroke-width="2"/>
    <text x="240" y="427" fill="#1c1c2e">set_frequency q[0].drive 4850000000.0</text>

    <rect x="220" y="468" width="920" height="64" rx="12" fill="#f5f5fa" stroke="#6a6a82" stroke-width="2"/>
    <text x="240" y="509" fill="#1c1c2e">play q[0].drive IQDrag(amplitude=amp, ...)</text>

    <rect x="220" y="550" width="920" height="64" rx="12" fill="#f5f5fa" stroke="#6a6a82" stroke-width="2"/>
    <text x="240" y="591" fill="#1c1c2e">sync q[0].drive q[0].readout</text>

    <rect x="220" y="632" width="920" height="64" rx="12" fill="#f5f5fa" stroke="#6a6a82" stroke-width="2"/>
    <text x="240" y="673" fill="#1c1c2e">measure q[0].readout ... fields=["state", "iq"]</text>
  </g>

  <!-- the class behind each line -->
  <g font-size="22" font-weight="600" text-anchor="end">
    <text x="1120" y="181" fill="#0f766e">Block</text>
    <text x="1120" y="263" fill="#0f766e">Average</text>
    <text x="1120" y="345" fill="#0f766e">Sweep</text>
    <text x="1120" y="427" fill="#6a6a82">SetFrequency</text>
    <text x="1120" y="509" fill="#6a6a82">Play</text>
    <text x="1120" y="591" fill="#6a6a82">Sync</text>
    <text x="1120" y="673" fill="#6a6a82">Measure</text>
  </g>

  <!-- what each block contributes to the shape of the result -->
  <g fill="#6a6a82">
    <circle cx="1140" cy="254" r="5"/>
    <circle cx="1140" cy="336" r="5"/>
    <circle cx="1140" cy="664" r="5"/>
  </g>
  <g fill="none" stroke="#6a6a82" stroke-width="2">
    <path d="M1140 254 H1180"/>
    <path d="M1140 336 H1180"/>
    <path d="M1140 664 H1180"/>
  </g>
  <g font-size="23" font-weight="700" fill="#0f766e">
    <text x="1196" y="262">no new dimension</text>
    <text x="1196" y="344">one dimension</text>
    <text x="1196" y="672">one record</text>
  </g>

  <!-- the result of running it -->
  <rect x="40" y="742" width="1520" height="118" rx="12" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
  <text x="64" y="776" font-size="22" font-weight="700" fill="#0b5c56">what comes back</text>
  <g font-size="22" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1c1c2e">
    <text x="64" y="810">result.get(m0)</text>
    <text x="760" y="810">dims ("amp", "IQ")</text>
    <text x="1120" y="810">shape (41, 2)</text>
    <text x="64" y="842">result.get(m0, field=MeasurementField.STATE)</text>
    <text x="760" y="842">dims ("amp",)</text>
    <text x="1120" y="842">shape (41,)</text>
  </g>
  </g>
</svg>
