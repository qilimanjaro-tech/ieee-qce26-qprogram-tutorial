<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"
     role="img" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>A bus is one signal path</title>
  <desc>Instrument ports map onto named buses, which map onto lines on the chip. One qubit owns
  three buses that do unrelated jobs, and one readout feedline carries two qubits at once. Below,
  the three bus kinds with their channel type, whether they acquire, and the operations each accepts.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10.5" refY="6"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>

  <text x="40" y="52" font-size="32" font-weight="700" fill="#1c1c2e">A bus is one signal path</text>
  <text x="40" y="84" font-size="22" fill="#6a6a82">operations name the line they act on, never the qubit</text>

  <!-- ===================== top: ports -> buses -> chip ===================== -->
  <text x="200" y="128" font-size="22" font-weight="700" fill="#0f766e" text-anchor="middle">Instrument ports</text>
  <text x="800" y="128" font-size="22" font-weight="700" fill="#0f766e" text-anchor="middle">Buses</text>
  <text x="1380" y="128" font-size="22" font-weight="700" fill="#0f766e" text-anchor="middle">Chip</text>

  <!-- ports, ordered so nothing has to cross -->
  <rect x="60" y="146" width="280" height="52" rx="9" fill="#f5f5fa" stroke="#6a6a82" stroke-width="2"/>
  <text x="200" y="180" font-size="21" fill="#1c1c2e" text-anchor="middle">AWG out 1 + 2 (IQ)</text>
  <rect x="60" y="216" width="280" height="52" rx="9" fill="#f5f5fa" stroke="#6a6a82" stroke-width="2"/>
  <text x="200" y="250" font-size="21" fill="#1c1c2e" text-anchor="middle">DC ch 1</text>
  <rect x="60" y="286" width="280" height="52" rx="9" fill="#f5f5fa" stroke="#6a6a82" stroke-width="2"/>
  <text x="200" y="320" font-size="21" fill="#1c1c2e" text-anchor="middle">AWG out 3 + 4 (IQ)</text>
  <rect x="60" y="356" width="280" height="52" rx="9" fill="#f5f5fa" stroke="#6a6a82" stroke-width="2"/>
  <text x="200" y="390" font-size="21" fill="#1c1c2e" text-anchor="middle">DC ch 2</text>
  <rect x="60" y="426" width="280" height="52" rx="9" fill="#f5f5fa" stroke="#6a6a82" stroke-width="2"/>
  <text x="200" y="460" font-size="21" fill="#1c1c2e" text-anchor="middle">AWG out 5 + 6 &#183; ADC 1</text>

  <!-- buses -->
  <rect x="606" y="146" width="388" height="52" rx="9" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
  <text x="800" y="180" font-size="22" fill="#1c1c2e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">q[0].drive</text>
  <rect x="606" y="216" width="388" height="52" rx="9" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
  <text x="800" y="250" font-size="22" fill="#1c1c2e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">q[0].flux</text>
  <rect x="606" y="286" width="388" height="52" rx="9" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
  <text x="800" y="320" font-size="22" fill="#1c1c2e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">q[1].drive</text>
  <rect x="606" y="356" width="388" height="52" rx="9" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
  <text x="800" y="390" font-size="22" fill="#1c1c2e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">q[1].flux</text>
  <rect x="606" y="426" width="388" height="52" rx="9" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
  <text x="800" y="460" font-size="22" fill="#1c1c2e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">q[0].readout &#160;&#183;&#160; q[1].readout</text>

  <!-- port -> bus links -->
  <line x1="344" y1="172" x2="602" y2="172" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="344" y1="242" x2="602" y2="242" stroke="#6a6a82" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <line x1="344" y1="312" x2="602" y2="312" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="344" y1="382" x2="602" y2="382" stroke="#6a6a82" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <line x1="344" y1="452" x2="602" y2="452" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- chip -->
  <rect x="1150" y="146" width="410" height="332" rx="14" fill="#f5f5fa" stroke="#0f766e" stroke-width="2"/>

  <rect x="1186" y="176" width="150" height="70" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="1261" y="208" font-size="22" font-weight="700" fill="#1c1c2e" text-anchor="middle">q0</text>
  <text x="1261" y="234" font-size="19" fill="#6a6a82" text-anchor="middle">4.85 GHz</text>
  <rect x="1186" y="286" width="150" height="70" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="1261" y="318" font-size="22" font-weight="700" fill="#1c1c2e" text-anchor="middle">q1</text>
  <text x="1261" y="344" font-size="19" fill="#6a6a82" text-anchor="middle">5.12 GHz</text>

  <rect x="1382" y="176" width="150" height="70" rx="10" fill="#ffffff" stroke="#6a6a82" stroke-width="2"/>
  <text x="1457" y="208" font-size="20" fill="#1c1c2e" text-anchor="middle">res 0</text>
  <text x="1457" y="234" font-size="19" fill="#6a6a82" text-anchor="middle">7.20 GHz</text>
  <rect x="1382" y="286" width="150" height="70" rx="10" fill="#ffffff" stroke="#6a6a82" stroke-width="2"/>
  <text x="1457" y="318" font-size="20" fill="#1c1c2e" text-anchor="middle">res 1</text>
  <text x="1457" y="344" font-size="19" fill="#6a6a82" text-anchor="middle">7.35 GHz</text>

  <line x1="1336" y1="211" x2="1378" y2="211" stroke="#0f766e" stroke-width="2"/>
  <line x1="1336" y1="321" x2="1378" y2="321" stroke="#0f766e" stroke-width="2"/>

  <!-- the shared feedline both resonators hang off -->
  <line x1="1457" y1="246" x2="1457" y2="286" stroke="#6a6a82" stroke-width="2"/>
  <line x1="1457" y1="356" x2="1457" y2="428" stroke="#6a6a82" stroke-width="2"/>
  <line x1="1186" y1="428" x2="1457" y2="428" stroke="#0f766e" stroke-width="3"/>
  <text x="1321" y="456" font-size="20" fill="#6a6a82" text-anchor="middle">one shared feedline</text>

  <!-- bus -> chip links -->
  <line x1="998" y1="172" x2="1182" y2="196" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="998" y1="242" x2="1182" y2="228" stroke="#6a6a82" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <line x1="998" y1="312" x2="1182" y2="306" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="998" y1="382" x2="1182" y2="338" stroke="#6a6a82" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <line x1="998" y1="452" x2="1182" y2="428" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="800" y="516" font-size="21" fill="#0b5c56" text-anchor="middle">two qubits, five buses, three instruments, and one bus name per signal path</text>

  <!-- ===================== bottom: the three bus kinds ===================== -->
  <line x1="40" y1="546" x2="1560" y2="546" stroke="#e6e6ef" stroke-width="2"/>
  <text x="40" y="590" font-size="24" font-weight="700" fill="#1c1c2e">What each kind of bus is, and what it accepts</text>

  <rect x="40" y="610" width="490" height="252" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="66" y="650" font-size="24" font-weight="700" fill="#0f766e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">drive</text>
  <text x="66" y="682" font-size="20" fill="#6a6a82">two DACs into an IQ mixer, no ADC</text>
  <text x="66" y="712" font-size="20" fill="#1c1c2e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">channel=iq &#160;&#183;&#160; acquires=False</text>
  <line x1="66" y1="730" x2="504" y2="730" stroke="#e6e6ef" stroke-width="2"/>
  <text x="66" y="762" font-size="20" fill="#1c1c2e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">set_frequency  set_phase  reset_phase</text>
  <text x="66" y="792" font-size="20" fill="#1c1c2e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">set_gain  play  wait  sync</text>
  <text x="66" y="834" font-size="20" fill="#6a6a82">rotations: area sets the angle, phase the axis</text>

  <rect x="555" y="610" width="490" height="252" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="581" y="650" font-size="24" font-weight="700" fill="#0f766e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">readout</text>
  <text x="581" y="682" font-size="20" fill="#6a6a82">an IQ pair out, an ADC on the way back</text>
  <text x="581" y="712" font-size="20" fill="#1c1c2e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">channel=iq &#160;&#183;&#160; acquires=True</text>
  <line x1="581" y1="730" x2="1019" y2="730" stroke="#e6e6ef" stroke-width="2"/>
  <text x="581" y="762" font-size="20" fill="#1c1c2e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">everything a drive bus takes, plus</text>
  <text x="581" y="792" font-size="20" fill="#1c1c2e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">measure</text>
  <text x="581" y="834" font-size="20" fill="#6a6a82">the only bus a measurement can name</text>

  <rect x="1070" y="610" width="490" height="252" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="1096" y="650" font-size="24" font-weight="700" fill="#0f766e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">flux</text>
  <text x="1096" y="682" font-size="20" fill="#6a6a82">one filtered wire, no carrier, no ADC</text>
  <text x="1096" y="712" font-size="20" fill="#1c1c2e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">channel=real &#160;&#183;&#160; acquires=False</text>
  <line x1="1096" y1="730" x2="1534" y2="730" stroke="#e6e6ef" stroke-width="2"/>
  <text x="1096" y="762" font-size="20" fill="#1c1c2e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">set_offset  play  wait  sync</text>
  <text x="1096" y="792" font-size="20" fill="#1c1c2e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">single-channel waveforms only</text>
  <text x="1096" y="834" font-size="20" fill="#6a6a82">moves f01, and often on a separate box</text>
</svg>
