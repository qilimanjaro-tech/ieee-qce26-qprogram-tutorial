<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 496" width="1600" height="496"
     role="img" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>A bus is one signal path</title>
  <desc>Instrument ports map onto named buses, which map onto lines on the chip. One qubit owns
  three buses that do unrelated jobs, a drive line and a flux line of its own, and a readout line
  on a feedline it shares with the other qubit. Five bus names for five signal paths across three
  instruments.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10.5" refY="6"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect width="1600" height="496" fill="#ffffff"/>

  <text x="40" y="52" font-size="32" font-weight="700" fill="#1c1c2e">A bus is one signal path</text>

  <!-- ===================== top: ports -> buses -> chip ===================== -->
  <text x="200" y="104" font-size="22" font-weight="700" fill="#0f766e" text-anchor="middle">Instrument ports</text>
  <text x="800" y="104" font-size="22" font-weight="700" fill="#0f766e" text-anchor="middle">Buses</text>
  <text x="1380" y="104" font-size="22" font-weight="700" fill="#0f766e" text-anchor="middle">Chip</text>

  <!-- ports, ordered so nothing has to cross -->
  <rect x="60" y="122" width="280" height="52" rx="9" fill="#f5f5fa" stroke="#6a6a82" stroke-width="2"/>
  <text x="200" y="156" font-size="21" fill="#1c1c2e" text-anchor="middle">AWG out 1 + 2 (IQ)</text>
  <rect x="60" y="192" width="280" height="52" rx="9" fill="#f5f5fa" stroke="#6a6a82" stroke-width="2"/>
  <text x="200" y="226" font-size="21" fill="#1c1c2e" text-anchor="middle">DC ch 1</text>
  <rect x="60" y="262" width="280" height="52" rx="9" fill="#f5f5fa" stroke="#6a6a82" stroke-width="2"/>
  <text x="200" y="296" font-size="21" fill="#1c1c2e" text-anchor="middle">AWG out 3 + 4 (IQ)</text>
  <rect x="60" y="332" width="280" height="52" rx="9" fill="#f5f5fa" stroke="#6a6a82" stroke-width="2"/>
  <text x="200" y="366" font-size="21" fill="#1c1c2e" text-anchor="middle">DC ch 2</text>
  <rect x="60" y="402" width="280" height="52" rx="9" fill="#f5f5fa" stroke="#6a6a82" stroke-width="2"/>
  <text x="200" y="436" font-size="21" fill="#1c1c2e" text-anchor="middle">AWG out 5 + 6 &#183; ADC 1</text>

  <!-- buses -->
  <rect x="606" y="122" width="388" height="52" rx="9" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
  <text x="800" y="156" font-size="22" fill="#1c1c2e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">q[0].drive</text>
  <rect x="606" y="192" width="388" height="52" rx="9" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
  <text x="800" y="226" font-size="22" fill="#1c1c2e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">q[0].flux</text>
  <rect x="606" y="262" width="388" height="52" rx="9" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
  <text x="800" y="296" font-size="22" fill="#1c1c2e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">q[1].drive</text>
  <rect x="606" y="332" width="388" height="52" rx="9" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
  <text x="800" y="366" font-size="22" fill="#1c1c2e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">q[1].flux</text>
  <rect x="606" y="402" width="388" height="52" rx="9" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
  <text x="800" y="436" font-size="22" fill="#1c1c2e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">q[0].readout &#160;&#183;&#160; q[1].readout</text>

  <!-- port -> bus links -->
  <line x1="344" y1="148" x2="602" y2="148" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="344" y1="218" x2="602" y2="218" stroke="#6a6a82" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <line x1="344" y1="288" x2="602" y2="288" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="344" y1="358" x2="602" y2="358" stroke="#6a6a82" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <line x1="344" y1="428" x2="602" y2="428" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- chip -->
  <rect x="1150" y="122" width="410" height="332" rx="14" fill="#f5f5fa" stroke="#0f766e" stroke-width="2"/>

  <rect x="1186" y="152" width="150" height="70" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="1261" y="184" font-size="22" font-weight="700" fill="#1c1c2e" text-anchor="middle">q0</text>
  <text x="1261" y="210" font-size="19" fill="#6a6a82" text-anchor="middle">4.85 GHz</text>
  <rect x="1186" y="262" width="150" height="70" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="1261" y="294" font-size="22" font-weight="700" fill="#1c1c2e" text-anchor="middle">q1</text>
  <text x="1261" y="320" font-size="19" fill="#6a6a82" text-anchor="middle">5.12 GHz</text>

  <rect x="1382" y="152" width="150" height="70" rx="10" fill="#ffffff" stroke="#6a6a82" stroke-width="2"/>
  <text x="1457" y="184" font-size="20" fill="#1c1c2e" text-anchor="middle">res 0</text>
  <text x="1457" y="210" font-size="19" fill="#6a6a82" text-anchor="middle">7.20 GHz</text>
  <rect x="1382" y="262" width="150" height="70" rx="10" fill="#ffffff" stroke="#6a6a82" stroke-width="2"/>
  <text x="1457" y="294" font-size="20" fill="#1c1c2e" text-anchor="middle">res 1</text>
  <text x="1457" y="320" font-size="19" fill="#6a6a82" text-anchor="middle">7.35 GHz</text>

  <line x1="1336" y1="187" x2="1378" y2="187" stroke="#0f766e" stroke-width="2"/>
  <line x1="1336" y1="297" x2="1378" y2="297" stroke="#0f766e" stroke-width="2"/>

  <!-- the shared feedline both resonators hang off -->
  <line x1="1457" y1="222" x2="1457" y2="262" stroke="#6a6a82" stroke-width="2"/>
  <line x1="1457" y1="332" x2="1457" y2="404" stroke="#6a6a82" stroke-width="2"/>
  <line x1="1186" y1="404" x2="1457" y2="404" stroke="#0f766e" stroke-width="3"/>
  <text x="1321" y="432" font-size="20" fill="#6a6a82" text-anchor="middle">one shared feedline</text>

  <!-- bus -> chip links -->
  <line x1="998" y1="148" x2="1182" y2="172" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="998" y1="218" x2="1182" y2="204" stroke="#6a6a82" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <line x1="998" y1="288" x2="1182" y2="282" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="998" y1="358" x2="1182" y2="314" stroke="#6a6a82" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <line x1="998" y1="428" x2="1182" y2="404" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>


</svg>
