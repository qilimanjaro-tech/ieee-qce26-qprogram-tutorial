<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 840" width="1600" height="840"
     role="img" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>What a transmon is</title>
  <desc>A capacitor sitting across a Josephson junction, with the charging energy and the Josephson
  energy labelled and the transmon regime marked at a ratio above about fifty. Beside it, the cosine
  well that circuit gives you, with four levels drawn in it: the qubit transition at 4.85 GHz out of
  the bottom pair, and the leakage transition 300 MHz below it out of the next pair. Underneath, two
  miniature ladders set the evenly spaced rungs of a harmonic oscillator against the crowded rungs of
  a transmon.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10.5" refY="6"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrowgrey" viewBox="0 0 12 12" refX="10.5" refY="6"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#6a6a82"/>
    </marker>
  </defs>

  <rect width="1600" height="840" fill="#ffffff"/>

  <text x="40" y="52" font-size="32" font-weight="700" fill="#1c1c2e">What a transmon is</text>

  <!-- ============ band A: the circuit ============ -->
  <rect x="40" y="90" width="560" height="520" rx="14" fill="#f5f5fa" stroke="#6a6a82" stroke-width="2"/>
  <text x="68" y="132" font-size="24" font-weight="700" fill="#1c1c2e">The circuit</text>

  <text x="150" y="178" font-size="20" fill="#6a6a82" text-anchor="middle">capacitor</text>
  <text x="490" y="178" font-size="20" fill="#6a6a82" text-anchor="middle">junction</text>

  <!-- the loop -->
  <line x1="150" y1="196" x2="490" y2="196" stroke="#1c1c2e" stroke-width="2"/>
  <line x1="150" y1="418" x2="490" y2="418" stroke="#1c1c2e" stroke-width="2"/>

  <!-- left branch: the capacitor -->
  <line x1="150" y1="196" x2="150" y2="296" stroke="#1c1c2e" stroke-width="2"/>
  <line x1="100" y1="296" x2="200" y2="296" stroke="#0f766e" stroke-width="3"/>
  <line x1="100" y1="318" x2="200" y2="318" stroke="#0f766e" stroke-width="3"/>
  <line x1="150" y1="318" x2="150" y2="418" stroke="#1c1c2e" stroke-width="2"/>

  <!-- right branch: the boxed X of a Josephson junction -->
  <line x1="490" y1="196" x2="490" y2="275" stroke="#1c1c2e" stroke-width="2"/>
  <rect x="458" y="275" width="64" height="64" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <line x1="466" y1="283" x2="514" y2="331" stroke="#0f766e" stroke-width="2"/>
  <line x1="514" y1="283" x2="466" y2="331" stroke="#0f766e" stroke-width="2"/>
  <line x1="490" y1="339" x2="490" y2="418" stroke="#1c1c2e" stroke-width="2"/>

  <text x="150" y="462" font-size="24" font-weight="700" fill="#0f766e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">E_C</text>
  <text x="150" y="490" font-size="20" fill="#6a6a82" text-anchor="middle">charging energy</text>
  <text x="490" y="462" font-size="24" font-weight="700" fill="#0f766e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">E_J</text>
  <text x="490" y="490" font-size="20" fill="#6a6a82" text-anchor="middle">Josephson energy</text>

  <rect x="68" y="518" width="504" height="64" rx="10" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
  <text x="92" y="558" font-size="22" font-weight="700" fill="#1c1c2e">transmon regime</text>
  <text x="548" y="558" font-size="24" font-weight="700" fill="#0f766e" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">E_J/E_C &gt;~ 50</text>

  <!-- ============ band B: the energy ladder ============ -->
  <rect x="620" y="90" width="940" height="520" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="648" y="132" font-size="24" font-weight="700" fill="#1c1c2e">The energy ladder</text>

  <!-- the cosine-flattened well -->
  <polyline fill="none" stroke="#1c1c2e" stroke-width="2.5" points="
            668.0,178.0 687.3,185.0 706.7,205.3 726.0,237.8 745.3,280.0 764.7,329.2 784.0,382.0
            803.3,434.8 822.7,484.0 842.0,526.2 861.3,558.7 880.7,579.0 900.0,586.0 919.3,579.0
            938.7,558.7 958.0,526.2 977.3,484.0 996.7,434.8 1016.0,382.0 1035.3,329.2 1054.7,280.0
            1074.0,237.8 1093.3,205.3 1112.7,185.0 1132.0,178.0"/>

  <!-- the levels, each drawn as wide as the well is at that height -->
  <line x1="864.6" y1="563" x2="935.4" y2="563" stroke="#0f766e" stroke-width="3"/>
  <line x1="800.8" y1="428" x2="999.2" y2="428" stroke="#0f766e" stroke-width="3"/>
  <line x1="760.1" y1="317" x2="1039.9" y2="317" stroke="#6a6a82" stroke-width="3"/>
  <line x1="721.9" y1="230" x2="1078.1" y2="230" stroke="#6a6a82" stroke-width="3"/>

  <text x="853" y="570" font-size="22" font-weight="700" fill="#1c1c2e" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">|0&gt;</text>
  <text x="789" y="435" font-size="22" font-weight="700" fill="#1c1c2e" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">|1&gt;</text>
  <text x="748" y="324" font-size="22" font-weight="700" fill="#6a6a82" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">|2&gt;</text>
  <text x="710" y="237" font-size="22" font-weight="700" fill="#6a6a82" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">|3&gt;</text>

  <!-- the three annotated levels carried out to the boxes on the right -->
  <line x1="935.4" y1="563" x2="1150" y2="563" stroke="#6a6a82" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="999.2" y1="428" x2="1150" y2="428" stroke="#6a6a82" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="1039.9" y1="317" x2="1150" y2="317" stroke="#6a6a82" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- the leakage transition, greyed out -->
  <rect x="1150" y="317" width="382" height="111" rx="10" fill="#f5f5fa" stroke="#6a6a82" stroke-width="2"/>
  <line x1="1180" y1="418" x2="1180" y2="329" stroke="#6a6a82" stroke-width="2" marker-end="url(#arrowgrey)"/>
  <text x="1204" y="361" font-size="22" fill="#1c1c2e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">f12 = f01 + alpha</text>
  <text x="1204" y="393" font-size="20" fill="#6a6a82" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">alpha ~ -300 MHz</text>
  <text x="1418" y="393" font-size="20" fill="#6a6a82">&#183; leakage</text>

  <!-- the qubit transition, in the accent colour -->
  <rect x="1150" y="428" width="382" height="135" rx="10" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
  <line x1="1180" y1="551" x2="1180" y2="440" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1204" y="484" font-size="22" fill="#1c1c2e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">f01 = 4.85 GHz</text>
  <text x="1204" y="516" font-size="20" fill="#0b5c56">the one transition you drive</text>

  <!-- ============ band C: the two ladders side by side ============ -->
  <rect x="560" y="640" width="480" height="160" rx="14" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>

  <line x1="615" y1="748" x2="765" y2="748" stroke="#6a6a82" stroke-width="2.5"/>
  <line x1="615" y1="719" x2="765" y2="719" stroke="#6a6a82" stroke-width="2.5"/>
  <line x1="615" y1="689" x2="765" y2="689" stroke="#6a6a82" stroke-width="2.5"/>
  <line x1="615" y1="660" x2="765" y2="660" stroke="#6a6a82" stroke-width="2.5"/>
  <text x="690" y="780" font-size="20" fill="#6a6a82" text-anchor="middle">harmonic</text>

  <line x1="835" y1="748" x2="985" y2="748" stroke="#0f766e" stroke-width="2.5"/>
  <line x1="835" y1="707" x2="985" y2="707" stroke="#0f766e" stroke-width="2.5"/>
  <line x1="835" y1="678" x2="985" y2="678" stroke="#0f766e" stroke-width="2.5"/>
  <line x1="835" y1="660" x2="985" y2="660" stroke="#0f766e" stroke-width="2.5"/>
  <text x="910" y="780" font-size="20" fill="#0f766e" text-anchor="middle">transmon</text>
</svg>
