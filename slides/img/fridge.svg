<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 868" width="1600" height="868"
     role="img" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Why the fridge is built the way it is</title>
  <desc>The stages of a dilution refrigerator from room temperature down to the mixing chamber,
  with the input line on the left and the output line on the right. Going down, an attenuator at
  the 4 K plate, the still and the mixing chamber throws the signal away on purpose and
  re-thermalizes the noise it passes on to its own stage temperature. Coming up, the amplifiers are
  ordered coldest first, a parametric amplifier and an isolator at 10 mK and a HEMT at 4 K, because
  the returning tone is only a few tens of photons.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10.5" refY="6"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect width="1600" height="868" fill="#ffffff"/>

  <g transform="translate(0,-32)">

  <!-- column headers -->
  <text x="430" y="126" font-size="23" font-weight="700" fill="#0f766e" text-anchor="middle">input line</text>
  <text x="1210" y="126" font-size="23" font-weight="700" fill="#0f766e" text-anchor="middle">output line</text>

  <!-- ============ 300 K ============ -->
  <rect x="200" y="144" width="1240" height="88" rx="14" fill="#f5f5fa" stroke="#6a6a82" stroke-width="2"/>
  <text x="180" y="182" font-size="26" font-weight="700" fill="#1c1c2e" text-anchor="end">300 K</text>
  <text x="180" y="210" font-size="20" fill="#6a6a82" text-anchor="end">room temperature</text>

  <rect x="300" y="158" width="260" height="60" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="430" y="196" font-size="24" font-weight="700" fill="#1c1c2e" text-anchor="middle">Generator, AWG</text>

  <rect x="1080" y="158" width="260" height="60" rx="10" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
  <text x="1210" y="196" font-size="24" font-weight="700" fill="#1c1c2e" text-anchor="middle">Digitizer</text>

  <!-- ============ 50 K ============ -->
  <rect x="200" y="244" width="1240" height="62" rx="14" fill="#f5f5fa" stroke="#6a6a82" stroke-width="2"/>
  <text x="180" y="276" font-size="26" font-weight="700" fill="#1c1c2e" text-anchor="end">50 K</text>
  <text x="180" y="300" font-size="20" fill="#6a6a82" text-anchor="end">shield</text>

  <!-- ============ 4 K ============ -->
  <rect x="200" y="318" width="1240" height="88" rx="14" fill="#f5f5fa" stroke="#6a6a82" stroke-width="2"/>
  <text x="180" y="356" font-size="26" font-weight="700" fill="#1c1c2e" text-anchor="end">4 K</text>
  <text x="180" y="384" font-size="20" fill="#6a6a82" text-anchor="end">plate</text>

  <rect x="300" y="332" width="260" height="60" rx="10" fill="#ffffff" stroke="#6a6a82" stroke-width="2"/>
  <text x="430" y="358" font-size="23" font-weight="700" fill="#1c1c2e" text-anchor="middle">attenuator</text>
  <text x="430" y="383" font-size="22" fill="#1c1c2e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">20 dB</text>

  <rect x="1080" y="332" width="260" height="60" rx="10" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
  <text x="1210" y="358" font-size="23" font-weight="700" fill="#1c1c2e" text-anchor="middle">HEMT</text>
  <text x="1210" y="383" font-size="20" fill="#6a6a82" text-anchor="middle">semiconductor amp</text>

  <!-- ============ 800 mK ============ -->
  <rect x="200" y="418" width="1240" height="82" rx="14" fill="#f5f5fa" stroke="#6a6a82" stroke-width="2"/>
  <text x="180" y="454" font-size="26" font-weight="700" fill="#1c1c2e" text-anchor="end">800 mK</text>
  <text x="180" y="480" font-size="20" fill="#6a6a82" text-anchor="end">still</text>

  <rect x="300" y="428" width="260" height="60" rx="10" fill="#ffffff" stroke="#6a6a82" stroke-width="2"/>
  <text x="430" y="454" font-size="23" font-weight="700" fill="#1c1c2e" text-anchor="middle">attenuator</text>
  <text x="430" y="479" font-size="22" fill="#1c1c2e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">10 dB</text>

  <!-- ============ 100 mK ============ -->
  <rect x="200" y="512" width="1240" height="62" rx="14" fill="#f5f5fa" stroke="#6a6a82" stroke-width="2"/>
  <text x="180" y="544" font-size="26" font-weight="700" fill="#1c1c2e" text-anchor="end">100 mK</text>
  <text x="180" y="568" font-size="20" fill="#6a6a82" text-anchor="end">cold plate</text>

  <!-- ============ 10 mK ============ -->
  <rect x="200" y="586" width="1240" height="286" rx="14" fill="#f5f5fa" stroke="#6a6a82" stroke-width="2"/>
  <text x="180" y="626" font-size="26" font-weight="700" fill="#1c1c2e" text-anchor="end">10 mK</text>
  <text x="180" y="652" font-size="20" fill="#6a6a82" text-anchor="end">mixing chamber</text>

  <rect x="300" y="600" width="260" height="60" rx="10" fill="#ffffff" stroke="#6a6a82" stroke-width="2"/>
  <text x="430" y="626" font-size="23" font-weight="700" fill="#1c1c2e" text-anchor="middle">attenuator</text>
  <text x="430" y="651" font-size="22" fill="#1c1c2e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">20 dB</text>

  <rect x="1080" y="600" width="260" height="56" rx="10" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
  <text x="1210" y="624" font-size="23" font-weight="700" fill="#1c1c2e" text-anchor="middle">TWPA</text>
  <text x="1210" y="647" font-size="20" fill="#6a6a82" text-anchor="middle">parametric amp</text>

  <rect x="1080" y="684" width="260" height="56" rx="10" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
  <text x="1210" y="720" font-size="23" font-weight="700" fill="#1c1c2e" text-anchor="middle">isolator</text>

  <rect x="360" y="792" width="920" height="64" rx="10" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
  <text x="820" y="833" font-size="24" font-weight="700" fill="#1c1c2e" text-anchor="middle">Chip</text>

  <!-- ============ the input line, going down ============ -->
  <line x1="430" y1="218" x2="430" y2="328" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="430" y1="392" x2="430" y2="424" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="430" y1="488" x2="430" y2="596" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="430" y1="660" x2="430" y2="788" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ the output line, coming up ============ -->
  <line x1="1210" y1="792" x2="1210" y2="744" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1210" y1="684" x2="1210" y2="660" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1210" y1="600" x2="1210" y2="396" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1210" y1="332" x2="1210" y2="222" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
</svg>
