<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" width="1600" height="760"
     role="img" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Two DACs make one microwave tone</title>
  <desc>On the left, two baseband envelopes coming off two DACs, an in-phase gaussian and a
  quadrature envelope shaped like its derivative. Each goes to its own multiplier. One local
  oscillator at 4.85 GHz feeds both, directly on the in-phase side and through a ninety degree
  phase shift on the quadrature side. The two products are summed, and what leaves on the right
  is a single burst on the drive line, an envelope with a carrier inside it, whose amplitude is
  the root sum of squares of the two inputs and whose phase is their arctangent. The quadrature
  envelope is drawn far larger than a real DRAG correction, which is under one percent of the
  in-phase peak.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10.5" refY="6"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrowgrey" viewBox="0 0 12 12" refX="10.5" refY="6"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#6a6a82"/>
    </marker>
  </defs>

