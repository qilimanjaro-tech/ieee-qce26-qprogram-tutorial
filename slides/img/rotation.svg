<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"
     role="img" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Area is the angle, phase is the axis</title>
  <desc>On the left, a Bloch sphere with the two rotation axes a drive bus can offer, one at carrier
  phase zero and one at ninety degrees. On the right, the same Gaussian burst on a carrier, with the
  area under its envelope shaded, and three copies of it at different amplitudes. Half the area is
  half the angle, and the phase decides what the state turns about.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10.5" refY="6"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrowgrey" viewBox="0 0 12 12" refX="10.5" refY="6"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#6a6a82"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>

  <text x="40" y="52" font-size="32" font-weight="700" fill="#1c1c2e">Area is the angle, phase is the axis</text>
  <text x="40" y="84" font-size="22" fill="#6a6a82">the two knobs a single-qubit gate actually has</text>

  <!-- ============ left panel: the Bloch sphere ============ -->
  <rect x="40" y="108" width="740" height="662" rx="14" fill="#f5f5fa" stroke="#6a6a82" stroke-width="2"/>
  <text x="68" y="150" font-size="24" font-weight="700" fill="#1c1c2e">Phase picks the axis</text>
  <text x="68" y="180" font-size="20" fill="#6a6a82">the carrier phase you set is the axis the state turns about</text>

  <!-- the sphere, drawn as a circle plus two ellipses -->
  <circle cx="410" cy="470" r="190" fill="#ffffff" stroke="#6a6a82" stroke-width="2"/>
  <ellipse cx="410" cy="470" rx="190" ry="60" fill="none" stroke="#6a6a82" stroke-width="2" stroke-dasharray="6 5"/>
  <ellipse cx="410" cy="470" rx="60" ry="190" fill="none" stroke="#6a6a82" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- Z, the axis you do not drive -->
  <line x1="410" y1="690" x2="410" y2="220" stroke="#6a6a82" stroke-width="2" marker-end="url(#arrowgrey)"/>
  <text x="410" y="206" font-size="22" font-weight="700" fill="#1c1c2e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">|0&gt;</text>
  <text x="410" y="716" font-size="22" font-weight="700" fill="#1c1c2e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">|1&gt;</text>
  <text x="430" y="250" font-size="20" fill="#6a6a82">Z</text>

  <!-- the two rotation axes, one per carrier phase -->
  <line x1="410" y1="470" x2="193" y2="510" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="172" y="516" font-size="24" font-weight="700" fill="#0f766e" text-anchor="middle">X</text>
  <text x="172" y="548" font-size="20" fill="#0b5c56" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">phase = 0</text>

  <line x1="410" y1="470" x2="646" y2="497" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="668" y="502" font-size="24" font-weight="700" fill="#0f766e">Y</text>
  <text x="680" y="548" font-size="20" fill="#0b5c56" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">phase = 90 deg</text>

  <!-- the state, partway through a turn about X -->
  <path d="M 410 280 A 190 190 0 0 1 488 404" fill="none" stroke="#0f766e" stroke-width="2"
        stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="466" y="320" font-size="20" fill="#0b5c56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">theta</text>
  <line x1="410" y1="470" x2="488" y2="404" stroke="#1c1c2e" stroke-width="3"/>
  <circle cx="488" cy="404" r="7" fill="#1c1c2e"/>
  <text x="502" y="396" font-size="20" fill="#1c1c2e">state</text>

  <text x="68" y="748" font-size="20" fill="#6a6a82">The pulse is the same either way. Only the carrier phase differs.</text>

  <!-- ============ right panel: the envelope ============ -->
  <rect x="800" y="108" width="760" height="662" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="828" y="150" font-size="24" font-weight="700" fill="#1c1c2e">Area is the angle</text>
  <text x="828" y="180" font-size="20" fill="#6a6a82">the integral of the envelope, not the height of it</text>

  <text x="1180" y="226" font-size="21" fill="#1c1c2e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">theta = integral of Omega(t) dt</text>

