<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800"
     role="img" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Area is the angle, phase is the axis</title>
  <desc>On the left, a Bloch sphere with the two rotation axes a drive bus can offer, one at carrier
  phase zero and one at ninety degrees, and a state part way through a turn about the first of them.
  On the right, a Gaussian burst on a carrier, with its envelope outline and the carrier inside it
  each labelled, and the same envelope drawn three times at the amplitudes that turn the state by
  pi, pi over two and pi over four.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10.5" refY="6"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrowgrey" viewBox="0 0 12 12" refX="10.5" refY="6"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#6a6a82"/>
    </marker>
  </defs>

  <rect width="1600" height="800" fill="#ffffff"/>

  <text x="40" y="52" font-size="32" font-weight="700" fill="#1c1c2e">Area is the angle, phase is the axis</text>

  <!-- ============ left panel: the Bloch sphere ============ -->
  <rect x="40" y="74" width="770" height="688" rx="14" fill="#f5f5fa" stroke="#6a6a82" stroke-width="2"/>
  <text x="68" y="116" font-size="26" font-weight="700" fill="#1c1c2e">Phase picks the axis</text>

  <!-- the sphere, drawn as a circle plus two ellipses -->
  <circle cx="405" cy="452" r="224" fill="#ffffff" stroke="#6a6a82" stroke-width="2"/>
  <ellipse cx="405" cy="452" rx="224" ry="71" fill="none" stroke="#6a6a82" stroke-width="2" stroke-dasharray="7 6"/>
  <ellipse cx="405" cy="452" rx="71" ry="224" fill="none" stroke="#6a6a82" stroke-width="2" stroke-dasharray="7 6"/>

  <!-- Z, the axis you do not drive -->
  <line x1="405" y1="702" x2="405" y2="184" stroke="#6a6a82" stroke-width="2" marker-end="url(#arrowgrey)"/>
  <text x="405" y="166" font-size="26" font-weight="700" fill="#1c1c2e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">|0&gt;</text>
  <text x="405" y="734" font-size="26" font-weight="700" fill="#1c1c2e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">|1&gt;</text>
  <text x="429" y="198" font-size="22" fill="#6a6a82">Z</text>

  <!-- the two rotation axes, one per carrier phase -->
  <line x1="405" y1="452" x2="149" y2="499" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="122" y="508" font-size="26" font-weight="700" fill="#0f766e" text-anchor="middle">X</text>
  <text x="122" y="556" font-size="20" fill="#0b5c56" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">phase = 0</text>

  <line x1="405" y1="452" x2="683" y2="484" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="712" y="492" font-size="26" font-weight="700" fill="#0f766e" text-anchor="middle">Y</text>
  <text x="704" y="556" font-size="20" fill="#0b5c56" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">phase = 90 deg</text>

  <!-- the state, part way through a turn about X -->
  <path d="M 405 228 A 224 224 0 0 1 497 374" fill="none" stroke="#0f766e" stroke-width="2"
        stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <text x="471" y="275" font-size="24" fill="#0b5c56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">theta</text>
  <line x1="405" y1="452" x2="497" y2="374" stroke="#1c1c2e" stroke-width="3"/>
  <circle cx="497" cy="374" r="8" fill="#1c1c2e"/>
  <text x="514" y="365" font-size="22" fill="#1c1c2e">state</text>

