  <text x="1180" y="548" font-size="20" fill="#6a6a82" text-anchor="middle">the outline is the envelope, the wiggle inside it is the carrier</text>

  <!-- the same shape three times, at three amplitudes -->
  <line x1="840" y1="690" x2="1530" y2="690" stroke="#6a6a82" stroke-width="2"/>
  <polygon fill="#e6f4f1" stroke="#0f766e" stroke-width="2.5" points="
            851,690
            851,686.6 859,684.4 867,681.1 875,676.5 883,670.2 891,662.2 899,652.5 907,641.3
            915,629.3 923,617.4 931,606.5 939,597.7 947,592 955,590 963,592 971,597.7
