  <text x="955" y="726" font-size="24" font-weight="700" fill="#0f766e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">pi</text>
  <text x="1185" y="726" font-size="24" font-weight="700" fill="#0f766e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">pi/2</text>
  <text x="1415" y="726" font-size="24" font-weight="700" fill="#0f766e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">pi/4</text>
  <text x="1185" y="756" font-size="20" fill="#6a6a82" text-anchor="middle">same shape, half the height, half the angle</text>

  <!-- ============ the caption that ties the two together ============ -->
  <rect x="40" y="786" width="1520" height="80" rx="14" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
  <text x="68" y="834" font-size="22" fill="#1c1c2e"><tspan font-weight="700">One envelope, two knobs.</tspan> The area sets how far the state turns, and the carrier phase sets what it turns about.</text>
</svg>
